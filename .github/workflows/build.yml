              (
                  "H3d setInteger:forKey: logs the key and the value written",
                  NS_USER_DEFAULTS,
                  '''- (())setInteger:(NSInteger)value forKey:(id)key {
              let num: id = msg_class![env; NSNumber numberWithInteger:value];
              () = msg![env; this setObject:num forKey:key];
