          echo "== patch L (v14): the CJK/Arabic fallback reaches the CoreText paths =="
          # Patch L makes the existing CJK/Arabic fallback reachable from the CoreText text
          # paths, which used to build their Font straight from a UIFont's kind and so
          # rasterised every Chinese/Japanese/Korean character with Liberation Sans - one
          # empty box per character. There is still exactly one implementation of the
          # classification, in src/frameworks/uikit/ui_font.rs; the CoreText call sites go
          # through it with the text in hand. The glyph-id drawing entry points cannot do
          # that (a glyph id carries no character) and are deliberately left alone.
          ui_font=src/frameworks/uikit/ui_font.rs
          core_text=src/frameworks/core_text.rs
          cg_context=src/frameworks/core_graphics/cg_context.rs
          frameworks=src/frameworks.rs
          uikit=src/frameworks/uikit.rs
          
          # One shared lookup, one classification, and the trace that names it.
          check_marker "$ui_font" "pub(crate) fn get_font<'a>(state: &'a mut State, kind: FontKind, text: &str) -> &'a Font {" 1
          check_marker "$ui_font" "pub(crate) enum FontKind {" 1
          check_marker "$ui_font" "pub(crate) struct State {" 1
          check_marker "$ui_font" "pub(crate) fn font_kind_from_uifont(" 1
          check_marker "$ui_font" "fn font_kind_is_bold(kind: FontKind) -> bool {" 1
          check_marker "$ui_font" "fn is_cjk_char(c: u32) -> bool {" 1
          check_marker "$ui_font" "fn is_arabic_char(c: u32) -> bool {" 1
          # The pre-patch forms must be gone: a `pub(super)` type is not reachable from
          # core_text, and a private fn cannot be shared with it.
          check_marker "$ui_font" "pub(super) enum FontKind {" 0
          check_marker "$ui_font" "pub(super) struct State {" 0
          check_marker "$ui_font" "\nfn get_font<'a>(state: &'a mut State" 0
          # The trace: normal-level log! (log_dbg! is suppressed on device), rate limited
          # to the first 20 substitutions, with the format the task asks for.
          check_marker "$ui_font" '"CJKFONT requested={:?} -> NotoSansSC ({} CJK chars)",' 1
          check_marker "$ui_font" "if CJKFONT_LOGGED.fetch_add(1, std::sync::atomic::Ordering::Relaxed) >= 20 {" 1
          check_marker "$ui_font" "static CJKFONT_LOGGED: std::sync::atomic::AtomicUsize =" 1
          check_marker "$ui_font" "note_cjk_font(kind, cjk_chars);" 1
          check_marker "$ui_font" "let is_bold = font_kind_is_bold(kind);" 1
          # The five metric getters (-capHeight, -xHeight, -ascender, -descender,
          # -leading) take no text, so they keep using get_font_by_kind directly: one
          # definition, five call sites. If one of them is ever wired to get_font, the
          # count changes and the build fails.
          check_marker "$ui_font" "get_font_by_kind(" 7
          
          # The state accessor the CoreText/CoreGraphics paths use, and the field that
          # makes it reachable outside the UIKit module.
          check_marker "$frameworks" "pub(crate) uikit: uikit::State," 1
