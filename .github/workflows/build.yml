                            "- (id)initWithContentsOfFile:(id)path usedEncoding:"):
              body = nsstr[nsstr.index(signature):]
              body = body[:body.index("\n}")]
              none_call = 'crate::fs_origin::note_read_file("NSString", &path_str, None);'
              some_call = 'crate::fs_origin::note_read_file("NSString", &path_str, Some(bytes.len()));'
              for call in (none_call, some_call):
                  if call not in body:
                      problems.append("src/frameworks/foundation/ns_string.rs: {} has no {!r}".format(signature, call))
              if none_call in body and "Err(_) => {" in body and "release(env, this);" in body:
                  # rindex: these methods release the object again in their `path == nil`
                  # early return, which comes before the match.
                  if not body.index("Err(_) => {") < body.index(none_call) < body.rindex("release(env, this);"):
