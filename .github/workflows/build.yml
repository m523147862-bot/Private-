          echo "== patch K (v12): the resource read goes through the guest filesystem =="
          # Patch K fixes a bug, like patches A, C, D and I. It changes one function and
          # only the way it reads: the bytes and the size that
          # CFURLCreateDataAndPropertiesFromResource returns now come from `env.fs`, the
          # guest filesystem, instead of `std::fs`, the host filesystem that never had the
          # guest path in the first place. The counts are exact, and `src/frameworks/
          # core_foundation/cf_url.rs` must not mention `std::fs::` at all: patch A's two
          # host calls are what the v10 device log proved were failing 39 times out of 39
