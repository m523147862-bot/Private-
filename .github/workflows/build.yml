          /// FNV-1a hash of the parts that identify one event, with a separator between
          /// them so `("ab", "c")` and `("a", "bc")` cannot collide.
          ///
          /// An event can happen every frame, so the identity is hashed instead of being
          /// stored: no allocation per event and a bounded table entry.
          fn event_hash(parts: &[&str]) -> u64 {
              let mut hash: u64 = 0xcbf2_9ce4_8422_2325;
              for part in parts {
                  for byte in part.as_bytes() {
                      hash ^= *byte as u64;
                      hash = hash.wrapping_mul(0x0000_0100_0000_01b3);
                  }
                  hash ^= 0x1f;
                  hash = hash.wrapping_mul(0x0000_0100_0000_01b3);
              }
              hash
          }

          /// Decides whether one event should print a line.
          ///
          /// `key` identifies the event: its first element is the line kind, the rest is
          /// what makes two events of that kind different (a path, or a defaults key plus
          /// the summary of its result). Two levels are combined and both must agree:
          ///
          /// * per key - the first `head` calls print in full, then one call in `sample`;
          /// * globally - after [GLOBAL_BUDGET] lines only one event in [GLOBAL_SAMPLE]
          ///   prints, which bounds the "thousands of different keys" case that a per-key
          ///   budget alone cannot.
          fn should_print(key: &[&str], head: u32, sample: u32) -> bool {
              let global = LINES.fetch_add(1, Ordering::Relaxed);
              if global >= GLOBAL_BUDGET && global % GLOBAL_SAMPLE != 0 {
                  return false;
              }
              let Ok(mut table) = key_table().lock() else {
                  // The lock can only be poisoned by a panic while it is held, and the
                  // critical section below only touches the map. If it ever is poisoned,
                  // the global backstop above is still enforced and everything prints.
                  return true;
              };
              let hash = event_hash(key);
              if table.len() >= MAX_TRACKED_KEYS && !table.contains_key(&hash) {
                  // Out of room: this key keeps no budget of its own and is governed by
                  // the global backstop above.
                  return true;
              }
              let seen = table.entry(hash).or_insert(0);
              let this = *seen;
              *seen = this.saturating_add(1);
              this < head || this % sample == 0
          }

          /// The first `max` bytes of `bytes` as lowercase hex, or `-` when empty.
          fn hex_prefix(bytes: &[u8], max: usize) -> String {
