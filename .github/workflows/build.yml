          const STACK_TRACES_MAX: u32 = 3;
          /// Stack traces printed so far, for [note_path_component_stack]'s counter.
          static STACK_TRACES: AtomicU32 = AtomicU32::new(0);

          /// The first this many `PATHFOUND` lines print in full.
          const FOUND_HEAD: u32 = 40;
          /// After the head, one `PATHFOUND` line in this many.
          const FOUND_SAMPLE: u32 = 100;
          /// `PATHFOUND` lines printed so far, for [note_path_found]'s counter.
          static PATH_FOUND_LINES: AtomicU32 = AtomicU32::new(0);

          /// Patch H (v9): the guest call stack at the moment a nil or empty path
          /// component is dropped.
