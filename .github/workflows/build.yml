                  ("the panic unwinder", "fn stack_trace_for_thread(&self, tid: usize) {", 1),
                  ("the panic backtrace header", '"Attempting to produce stack trace for current thread (#{}):"', 1),
                  ("patch E/F's final summary", "crate::fs_probe::print_final_summary();", 2),
              ):
                  if environment.count(marker) != expected:
                      fail("{}: {} appears {} time(s), expected {}".format(
                          ENV_RS, name, environment.count(marker), expected))
              origin = texts[FS_ORIGIN]
              for name, marker in (
                  ("G2 origin line", "pub fn note_path_component_origin(base: &str, component_is_nil: bool, pc: u32, ret: u32)",),
                  ("G3 lookup line", "pub fn note_defaults_query(selector: &str, key: &str, summary: &str)",),
                  ("G4 read line", "pub fn note_read_file(kind: &str, path: &str, size: Option<usize>)",),
                  ("G5 watched-file line", "pub fn note_special_file(path: &str, bytes: &[u8])",),
              ):
