          #!/usr/bin/env python3
          """Make the CJK/Arabic font fallback reach the CoreText and CoreGraphics text paths.
          
          The problem
          -----------
          The core already knows that the bundled Latin/serif/mono fonts cannot render
          CJK or Arabic text: `src/frameworks/uikit/ui_font.rs` classifies the codepoints
          of a string (`is_cjk_char` / `is_arabic_char`) and substitutes
          `NotoSansSC-Regular.otf` / `NotoSansSC-Bold.otf` (or the Noto Arabic faces)
          before it measures or draws.
          
          That mechanism was only wired into the `UIFont` / `NSString` text APIs. The
          CoreText and CoreGraphics text paths build their `Font` straight from a
          `UIFont`'s *kind*:
          
              let font_obj = font_from_uifont(env, font).unwrap_or_else(Font::sans_regular);
          
          `font_from_uifont` cannot see the text, so a string like "地下城与勇士" was laid
          out and rasterised with Liberation Sans, which has no CJK glyphs: every
          character became `.notdef`, which is the "one empty box per character" (tofu)
          that the app under test shows for Chinese, Japanese and Korean while its
          English text renders correctly.
          
          What this script changes
          -----------------------
          1. `src/frameworks/uikit/ui_font.rs`: the classification and the fallback
             selection are made reusable instead of being private to one module. The
             existing `get_font`, which is the *single* implementation of "which face does
             this text need", becomes `pub(crate)`; `FontKind` and `State` become
             `pub(crate)` so the kind can be passed in; `font_kind_from_uifont` is added
             next to `font_from_uifont`; a rate-limited `CJKFONT` trace line names the
             substitution. `get_font`'s body is otherwise unchanged (`is_bold` moves into
             a small helper so both the fallback test and the log can use it), and the
             CJK-over-Arabic priority is preserved.
          2. `src/frameworks.rs` + `src/frameworks/uikit.rs`: the state field is made
             `pub(crate)` and a `State::font_for_text` method exposes the cached lookup, so
             callers outside the UIKit module can use it *without* re-parsing an 8 MB Noto
             file per call and without any second copy of the classification logic.
          3. `src/frameworks/core_text.rs`: the four places that have the text in hand and
             then build a font from a `UIFont` become text-aware. This is the fix:
             `CTLineDraw` (the actual drawing call), `CTLineGetTypographicBounds` and
             `CTLineGetImageBounds` (the measurement used to lay the string out) and
             `CTFramesetterSuggestFrameSizeWithConstraints`.
          4. `src/frameworks/core_graphics/cg_context.rs`: the three glyph-id drawing
             entry points get a rate-limited `CJKNODEF` diagnostic. They draw glyph ids,
             not characters, so they *cannot* select a fallback font at all - see
             "What cannot be fixed here" below.
          
          What cannot be fixed here (and why)
          -----------------------------------
          * `CGContextShowGlyphsAtPoint` / `...AtPositions` / `...WithAdvances`
            (and `CGContextShowGlyphs`, which delegates to the first) receive
            `CGGlyph` ids, which are **only meaningful relative to the font that produced
            them**: the same number is a different glyph in a different font, and glyph id
            0 is `.notdef` in every font. By the time these functions run, the character
            is gone; there is nothing to classify and therefore no sound way to pick
            Noto Sans SC here. Rewriting the ids with a CJK font would render arbitrary
            wrong glyphs, not the requested ones, so the only honest thing this layer can
            do is report a run that is drawing `.notdef`. The `CJKNODEF` line does that,
            which is also the one piece of evidence a device log can give about whether
            the app draws its text through this path at all.
          * `CGContextShowTextAtPoint` and `CGContextShowText` are **empty stubs** in this
            tree (as is `CGContextSelectFont`): they take `_env` / `_context` / `_string`
            and do nothing, so they draw neither Latin nor CJK text and cannot be the
            source of the boxes. There is no font choice to make in them, and implementing
            them would be a new feature, not a fix.
          * `CTFontGetGlyphsForCharacters` (`core_text.rs`) *does* see the characters, but
            its output is a font-specific glyph id. Returning Noto Sans SC ids here while
            the drawing font is still the Latin one reproduces the problem in a worse
            form (wrong glyphs instead of empty boxes); ids that exceed the Latin font's
            glyph count are `.notdef` again. It is deliberately left alone. Fixing the
            glyph-id pipeline needs a link from the font that produced the ids to the font
            the context draws with (e.g. remembering, per font object, which fallback face
            its ids came from) - a design change, not a patch.
          * `UIFont -capHeight` / `-xHeight` / `-ascender` / `-descender` / `-leading` use
            `get_font_by_kind` without text. They are pure metrics of a font object, not of
            a string, so there is no text to classify and nothing to change.
          * `CGContextSetFont` cannot be made text-aware either: the text is not known
            when the font is selected.
          
          No non-text behaviour is touched, and nothing in patches A-K is modified.
          
          Usage: python3 patch_cjk_text_fallback_v14.py [repo-root]   (default: .)
          
          The script refuses to run unless every edit applies cleanly, and re-checks the
          result afterwards, so a silent no-op is impossible. Running it twice is a no-op.
          """
          
          import sys
          from pathlib import Path
          
          # Marks the patch. One per touched file: a file that already contains its marker
          # is left alone, which is what makes a second run a no-op.
          PATCH_MARKER = "Patch L (v14):"
          
          UI_FONT = "src/frameworks/uikit/ui_font.rs"
          UIKIT = "src/frameworks/uikit.rs"
          FRAMEWORKS = "src/frameworks.rs"
          CORE_TEXT = "src/frameworks/core_text.rs"
          CG_CONTEXT = "src/frameworks/core_graphics/cg_context.rs"
          
          # --------------------------------------------------------------------------
          # 1. ui_font.rs: make the one text-aware lookup reusable
          # --------------------------------------------------------------------------
          
          UI_FONT_OLD_KIND_DERIVE = r'''#[derive(Copy, Clone, Default, PartialEq, Eq, Hash)]
          enum FontKind {
          '''
          
          UI_FONT_NEW_KIND_DERIVE = r'''#[derive(Copy, Clone, Default, PartialEq, Eq, Hash, Debug)]
          pub(crate) enum FontKind {
          '''
          
          UI_FONT_OLD_STATE = r'''pub(super) struct State {
          '''
          
          UI_FONT_NEW_STATE = r'''pub(crate) struct State {
          '''
          
          UI_FONT_OLD_GET_FONT = r'''#[rustfmt::skip]
          fn get_font<'a>(state: &'a mut State, kind: FontKind, text: &str) -> &'a Font {
              let mut needs_cjk = false;
              let mut needs_arabic = false;
              for c in text.chars() {
                  let c = c as u32;
                  if is_cjk_char(c) {
                      needs_cjk = true;
                  } else if is_arabic_char(c) {
                      needs_arabic = true;
                  }
              }
          
              // CJK takes priority over Arabic when both are present, matching the order
              // in which fallbacks were historically added; the common case is text
              // containing only one of the two scripts.
              let is_bold = matches!(
                  kind,
                  FontKind::MonoBold | FontKind::MonoBoldItalic |
                  FontKind::SansBold | FontKind::SansBoldItalic |
                  FontKind::SerifBold | FontKind::SerifBoldItalic
              );
          
             if needs_cjk {
              if is_bold {
                  return state.sans_bold_zh.get_or_insert_with(Font::sans_bold_zh);
              }
              return state.sans_regular_zh.get_or_insert_with(Font::sans_regular_zh);
          }
              if needs_arabic {
                  if is_bold {
                      return state.sans_bold_ar.get_or_insert_with(Font::sans_bold_ar);
                  }
                  return state.sans_regular_ar.get_or_insert_with(Font::sans_regular_ar);
              }
          
              state.get_font_by_kind(kind)
          }
          '''
          
          UI_FONT_NEW_GET_FONT = r'''/// [FontKind]s whose fallback face is the bold one.
          fn font_kind_is_bold(kind: FontKind) -> bool {
              matches!(
                  kind,
                  FontKind::MonoBold | FontKind::MonoBoldItalic |
                  FontKind::SansBold | FontKind::SansBoldItalic |
                  FontKind::SerifBold | FontKind::SerifBoldItalic
              )
          }
          
          /// Rate-limited trace so a device run can confirm that a script-specific font
          /// really was substituted, and for which kind of font it was requested.
          ///
          /// `log!` and not `log_dbg!`: `log::ENABLED_MODULES` is empty on purpose
          /// (`src/log.rs`), so every debug-level log in this crate is suppressed on
          /// device.
          fn note_cjk_font(kind: FontKind, cjk_chars: usize) {
              static CJKFONT_LOGGED: std::sync::atomic::AtomicUsize =
                  std::sync::atomic::AtomicUsize::new(0);
              if CJKFONT_LOGGED.fetch_add(1, std::sync::atomic::Ordering::Relaxed) >= 20 {
                  return;
              }
              log!(
                  "CJKFONT requested={:?} -> NotoSansSC ({} CJK chars)",
                  kind,
                  cjk_chars
              );
          }
          
          /// Patch L (v14): the one text-aware font lookup. `kind` picks the face, the
          /// text decides whether a fallback face is needed at all. `pub(crate)` because
          /// the CoreText and CoreGraphics text paths have to reach the same decision this
          /// module already makes for `UIFont` text; this is the only implementation of
          /// it.
          #[rustfmt::skip]
          pub(crate) fn get_font<'a>(state: &'a mut State, kind: FontKind, text: &str) -> &'a Font {
              let mut cjk_chars = 0usize;
              let mut needs_arabic = false;
              for c in text.chars() {
                  let c = c as u32;
                  if is_cjk_char(c) {
                      cjk_chars += 1;
                  } else if is_arabic_char(c) {
                      needs_arabic = true;
                  }
              }
          
              // CJK takes priority over Arabic when both are present, matching the order
              // in which fallbacks were historically added; the common case is text
              // containing only one of the two scripts.
              let is_bold = font_kind_is_bold(kind);
          
              if cjk_chars > 0 {
                  note_cjk_font(kind, cjk_chars);
                  if is_bold {
                      return state.sans_bold_zh.get_or_insert_with(Font::sans_bold_zh);
                  }
                  return state.sans_regular_zh.get_or_insert_with(Font::sans_regular_zh);
              }
              if needs_arabic {
                  if is_bold {
                      return state.sans_bold_ar.get_or_insert_with(Font::sans_bold_ar);
                  }
                  return state.sans_regular_ar.get_or_insert_with(Font::sans_regular_ar);
              }
          
              state.get_font_by_kind(kind)
          }
          '''
          
          UI_FONT_OLD_CONVERT = r'''fn convert_line_break_mode(ui_mode: UILineBreakMode) -> WrapMode {
          '''
          
          UI_FONT_NEW_CONVERT = r'''/// Patch L (v14): the [FontKind] of a UIFont, or `None` if `obj` is not a
          /// UIFont.
          ///
          /// The same pre-check [font_from_uifont] does, but returning the kind instead of
          /// a constructed [Font]: a caller that has the text in hand should pass the kind
          /// to [get_font] so that the CJK/Arabic fallback applies.
          pub(crate) fn font_kind_from_uifont(
              env: &mut Environment,
              obj: crate::objc::id,
          ) -> Option<FontKind> {
              if !is_uifont(env, obj) {
                  return None;
              }
              Some(env.objc.borrow::<UIFontHostObject>(obj).kind)
          }
          
          fn convert_line_break_mode(ui_mode: UILineBreakMode) -> WrapMode {
          '''
          
          # --------------------------------------------------------------------------
          # 2. frameworks.rs / uikit.rs: expose that lookup on the state
          # --------------------------------------------------------------------------
          
          FRAMEWORKS_OLD = r'''    uikit: uikit::State,
          }
          '''
          
          FRAMEWORKS_NEW = r'''    // Patch L (v14): the CoreText/CoreGraphics text paths need the same
              // text-aware font lookup the UIKit text APIs use.
              pub(crate) uikit: uikit::State,
          }
          '''
          
          UIKIT_OLD = r'''    ui_responder: ui_responder::State,
          }
          '''
          
          UIKIT_NEW = r'''    ui_responder: ui_responder::State,
          }
          
          impl State {
              /// Patch L (v14): text-aware font lookup. `UIFont`'s own text APIs and the
              /// CoreText / CoreGraphics text paths have to agree on when a run needs the
              /// bundled Noto CJK/Arabic faces, so both go through [ui_font::get_font].
              /// The fonts themselves live in this state, so a caller outside this module
              /// gets the cached face instead of parsing an 8 MB Noto file.
              pub(crate) fn font_for_text(
                  &mut self,
                  kind: ui_font::FontKind,
                  text: &str,
              ) -> &crate::font::Font {
                  ui_font::get_font(&mut self.ui_font, kind, text)
              }
          }
          '''
          
          # --------------------------------------------------------------------------
          # 3. core_text.rs: the four text-aware call sites
          # --------------------------------------------------------------------------
          
          CORE_TEXT_OLD_IMPORT = (
              "use crate::frameworks::uikit::ui_font::{font_from_uifont, is_uifont, draw_font_glyph};"
          )
          
          CORE_TEXT_NEW_IMPORT = r'''// Patch L (v14): the CoreText text paths use the same text-aware font lookup as
          // the UIKit ones, so a run containing CJK or Arabic text never falls through to
          // a Latin face.
          use crate::frameworks::uikit::ui_font::{
              font_from_uifont, font_kind_from_uifont, is_uifont, draw_font_glyph, FontKind,
          };'''
          
          # Identical at all four sites; each of them has `text_str` in scope and `font`
          # bound to the line's UIFont.
          CORE_TEXT_OLD_SITE = (
              "    let font_obj = font_from_uifont(env, font).unwrap_or_else(Font::sans_regular);\n"
          )
          CORE_TEXT_OLD_SITE_COUNT = 4
          
          CORE_TEXT_NEW_SITE = r'''    let font_kind = font_kind_from_uifont(env, font).unwrap_or(FontKind::SansRegular);
              // Patch L (v14): the face is chosen from the text about to be measured or
              // drawn, so CJK/Arabic runs use the Noto face. A non-UIFont still resolves to
              // the same Latin face as before.
              let font_obj = env.framework_state.uikit.font_for_text(font_kind, &text_str);
          '''
          
          # --------------------------------------------------------------------------
          # 4. cg_context.rs: the glyph-id path can only report what it cannot do
          # --------------------------------------------------------------------------
          
          CG_CONTEXT_OLD_FIRST_GLYPH_FN = r'''/// `void CGContextShowGlyphsAtPoint(CGContextRef c, CGFloat x, CGFloat y,
          ///                                  const CGGlyph *glyphs, size_t count)`
          fn CGContextShowGlyphsAtPoint(
          '''
          
          CG_CONTEXT_NEW_FIRST_GLYPH_FN = r'''/// Rate-limited diagnostic for the glyph-id text entry points.
          ///
          /// `CGContextShowGlyphs*` receives glyph ids, not characters, so - unlike the
          /// UIKit and CoreText text APIs - it cannot tell which script a run is in and
          /// therefore cannot choose the Noto CJK/Arabic fallback: a glyph id is only
          /// meaningful together with the font that produced it, and the same id in
          /// another font is another glyph. Glyph id 0 is `.notdef`, the "empty box" a
          /// Latin face produces for a character it does not have. Saying so is all this
          /// layer can do, and it is what makes a device log answer whether the app draws
          /// its text through this path at all.
          ///
          /// Patch L (v14): this is the whole of what can be done here.
          fn note_notdef_glyphs(glyph_ids: &[rusttype::GlyphId], entry: &str) {
              let notdef = glyph_ids.iter().filter(|id| id.0 == 0).count();
              if notdef == 0 {
                  return;
              }
              static CJKNODEF_LOGGED: std::sync::atomic::AtomicUsize =
                  std::sync::atomic::AtomicUsize::new(0);
              if CJKNODEF_LOGGED.fetch_add(1, std::sync::atomic::Ordering::Relaxed) >= 20 {
                  return;
              }
              log!(
                  "CJKNODEF {} glyphs={} notdef={} (glyph ids carry no characters, so no fallback font can be chosen here)",
                  entry,
                  glyph_ids.len(),
                  notdef
              );
          }
          
          /// `void CGContextShowGlyphsAtPoint(CGContextRef c, CGFloat x, CGFloat y,
          ///                                  const CGGlyph *glyphs, size_t count)`
          fn CGContextShowGlyphsAtPoint(
          '''
          
          CG_CONTEXT_AT_POINT_OLD = r'''        glyph_ids.push(rusttype::GlyphId(glyph_id));
              }
          
              let host = env.objc.borrow::<CGContextHostObject>(context);
          '''
          
          CG_CONTEXT_AT_POINT_NEW = r'''        glyph_ids.push(rusttype::GlyphId(glyph_id));
              }
              note_notdef_glyphs(&glyph_ids, "CGContextShowGlyphsAtPoint");
          
              let host = env.objc.borrow::<CGContextHostObject>(context);
          '''
          
          CG_CONTEXT_AT_POSITIONS_OLD = r'''        pos_vec.push((pos.x, pos.y));
              }
          '''
          
          CG_CONTEXT_AT_POSITIONS_NEW = r'''        pos_vec.push((pos.x, pos.y));
              }
              note_notdef_glyphs(&glyph_ids, "CGContextShowGlyphsAtPositions");
          '''
          
          CG_CONTEXT_WITH_ADVANCES_OLD = r'''        advance_vec.push((adv.width, adv.height));
              }
          '''
          
          CG_CONTEXT_WITH_ADVANCES_NEW = r'''        advance_vec.push((adv.width, adv.height));
              }
              note_notdef_glyphs(&glyph_ids, "CGContextShowGlyphsWithAdvances");
          '''
          
          # Post-conditions per file: (marker, expected count). `PATCH_MARKER` counts the
          # marker comments the edits above insert, which is also how a partly applied file
          # is detected.
          POSTCONDITIONS = {
              UI_FONT: (
                  (PATCH_MARKER, 2),
                  ("pub(crate) enum FontKind {", 1),
                  ("pub(crate) struct State {", 1),
                  ("pub(crate) fn get_font<'a>(state: &'a mut State", 1),
                  ("fn get_font<'a>(state: &'a mut State", 1),
                  ("pub(crate) fn font_kind_from_uifont(", 1),
                  ("fn font_kind_is_bold(kind: FontKind) -> bool {", 1),
                  ("if CJKFONT_LOGGED.fetch_add(1, std::sync::atomic::Ordering::Relaxed) >= 20 {", 1),
                  ('"CJKFONT requested={:?} -> NotoSansSC ({} CJK chars)",', 1),
                  ("let is_bold = font_kind_is_bold(kind);", 1),
                  # one implementation of the classification, used twice (two fallbacks)
                  ("if is_cjk_char(c) {", 1),
                  ("} else if is_arabic_char(c) {", 1),
                  ("pub(super) enum FontKind {", 0),
                  ("pub(super) struct State {", 0),
                  # the pre-patch declaration, which had no `pub(crate)`
                  ("\nfn get_font<'a>(state: &'a mut State, kind: FontKind, text: &str) -> &'a Font {", 0),
              ),
              FRAMEWORKS: (
                  (PATCH_MARKER, 1),
                  ("pub(crate) uikit: uikit::State,", 1),
              ),
              UIKIT: (
                  (PATCH_MARKER, 1),
                  ("pub(crate) fn font_for_text(", 1),
                  ("ui_font::get_font(&mut self.ui_font, kind, text)", 1),
              ),
              CORE_TEXT: (
                  (PATCH_MARKER, 5),
                  ("font_kind_from_uifont,", 1),
                  ("FontKind,\n};", 1),
                  ("let font_kind = font_kind_from_uifont(env, font).unwrap_or(FontKind::SansRegular);", 4),
                  ("env.framework_state.uikit.font_for_text(font_kind, &text_str);", 4),
                  # The glyph-id producers keep their old behaviour on purpose (see the
                  # module docstring): `font_from_uifont` is still used, but no longer on a
                  # path that has the text.
                  ("let font_obj = font_from_uifont(env, ui_font).unwrap_or_else(Font::sans_regular);", 1),
                  ("let font_obj = font_from_uifont(env, font).unwrap_or_else(Font::sans_regular);", 0),
                  ("use crate::frameworks::uikit::ui_font::{font_from_uifont, is_uifont, draw_font_glyph};", 0),
              ),
              CG_CONTEXT: (
                  (PATCH_MARKER, 1),
                  ("fn note_notdef_glyphs(glyph_ids: &[rusttype::GlyphId], entry: &str) {", 1),
                  ('"CJKNODEF {} glyphs={} notdef={} (glyph ids carry no characters, so no fallback font can be chosen here)",', 1),
                  ("if CJKNODEF_LOGGED.fetch_add(1, std::sync::atomic::Ordering::Relaxed) >= 20 {", 1),
                  ('note_notdef_glyphs(&glyph_ids, "CGContextShowGlyphsAtPoint");', 1),
                  ('note_notdef_glyphs(&glyph_ids, "CGContextShowGlyphsAtPositions");', 1),
                  ('note_notdef_glyphs(&glyph_ids, "CGContextShowGlyphsWithAdvances");', 1),
                  ("fn CGContextShowTextAtPoint(", 1),
                  ("fn CGContextShowText(", 1),
                  ("fn CGContextSelectFont(", 1),
              ),
          }
          
          # The glyph-id draw functions, and the text entry points that are stubs in this
          # tree. Asserted to be untouched so a later edit cannot quietly reintroduce a
          # Latin-only font choice there without this script's post-conditions noticing.
          UNTOUCHED_STUBS = {
              CG_CONTEXT: (
                  r'''fn CGContextShowTextAtPoint(
              _env: &mut Environment,
              _context: CGContextRef,
              _x: CGFloat,
              _y: CGFloat,
              _string: crate::mem::ConstPtr<u8>,
              _length: u32,
          ) {
          }
          ''',
                  r'''fn CGContextShowText(
              _env: &mut Environment,
              _context: CGContextRef,
              _string: crate::mem::ConstPtr<u8>,
              _length: u32,
          ) {
          }
          ''',
              ),
              CORE_TEXT: (
                  # `CTFontGetGlyphsForCharacters` still maps with the font object's own
                  # face; its glyph ids must stay in that font's namespace.
                  "    let font_obj = font_from_uifont(env, ui_font).unwrap_or_else(Font::sans_regular);\n",
              ),
          }
          
          
          def fail(message):
              print("ERROR: " + message, file=sys.stderr)
              raise SystemExit(1)
          
          
          def replace_once(text, old, new, what, count=1):
              found = text.count(old)
              if found != count:
                  fail("cannot find {} ({} match(es), expected {}); is the tree unpatched?".format(
                      what, found, count))
              return text.replace(old, new, count)
          
          
          def apply_to_file(path, edits):
              """Applies the edits of one file, unless the file already carries the marker."""
              original = path.read_text(encoding="utf-8").replace("\r\n", "\n")
              if PATCH_MARKER in original:
                  return original, False
              text = original
              for old, new, what in edits:
                  text = replace_once(text, old, new, what)
              return text, True
          
          
          def check(path, text):
              """Everything that must hold of the patched file."""
              if text.count("{") != text.count("}"):
                  fail("{}: unbalanced braces: {} '{{' vs {} '}}'".format(
                      path, text.count("{"), text.count("}")))
              for marker, expected in POSTCONDITIONS[path]:
                  count = text.count(marker)
                  if count != expected:
                      fail("{}: {!r} appears {} time(s), expected {}".format(
                          path, marker, count, expected))
              for untouched in UNTOUCHED_STUBS.get(path, ()):
                  if untouched not in text:
                      fail("{}: a block this patch must not touch is missing or was edited:\n{}".format(
                          path, untouched))
          
          
          def main():
              repo = Path(sys.argv[1] if len(sys.argv) > 1 else ".")
          
              edits_per_file = {
                  UI_FONT: [
                      (UI_FONT_OLD_KIND_DERIVE, UI_FONT_NEW_KIND_DERIVE, "the FontKind declaration"),
                      (UI_FONT_OLD_STATE, UI_FONT_NEW_STATE, "the ui_font State declaration"),
                      (UI_FONT_OLD_GET_FONT, UI_FONT_NEW_GET_FONT, "get_font"),
                      (UI_FONT_OLD_CONVERT, UI_FONT_NEW_CONVERT, "convert_line_break_mode"),
                  ],
                  FRAMEWORKS: [
                      (FRAMEWORKS_OLD, FRAMEWORKS_NEW, "the frameworks State uikit field"),
                  ],
                  UIKIT: [
                      (UIKIT_OLD, UIKIT_NEW, "the end of the uikit State struct"),
                  ],
                  CORE_TEXT: [
                      (CORE_TEXT_OLD_IMPORT, CORE_TEXT_NEW_IMPORT, "the ui_font import"),
                      (CORE_TEXT_OLD_SITE, CORE_TEXT_NEW_SITE,
                       "the {} font_from_uifont(env, font) sites".format(CORE_TEXT_OLD_SITE_COUNT)),
                  ],
                  CG_CONTEXT: [
                      (CG_CONTEXT_OLD_FIRST_GLYPH_FN, CG_CONTEXT_NEW_FIRST_GLYPH_FN,
                       "CGContextShowGlyphsAtPoint's declaration"),
                      (CG_CONTEXT_AT_POINT_OLD, CG_CONTEXT_AT_POINT_NEW,
                       "CGContextShowGlyphsAtPoint's glyph loop"),
                      (CG_CONTEXT_AT_POSITIONS_OLD, CG_CONTEXT_AT_POSITIONS_NEW,
                       "CGContextShowGlyphsAtPositions's glyph loop"),
                      (CG_CONTEXT_WITH_ADVANCES_OLD, CG_CONTEXT_WITH_ADVANCES_NEW,
                       "CGContextShowGlyphsWithAdvances's glyph loop"),
                  ],
              }
          
              for name in edits_per_file:
                  if not (repo / name).is_file():
                      fail("{} does not exist".format(repo / name))
          
              # core_text's four sites are identical, so they are replaced in one go and
              # handled separately: the per-marker count below is what proves all four
              # were really there.
              for name, edits in edits_per_file.items():
                  path = repo / name
                  if name == CORE_TEXT:
                      continue
                  text, written = apply_to_file(path, edits)
                  check(name, text)
                  if written:
                      with open(path, "w", encoding="utf-8", newline="\n") as output:
                          output.write(text)
                      print("Wrote {}".format(path))
                  else:
                      print("{} is unchanged".format(path))
          
              # core_text needs a mixed edit (one import line plus four identical sites),
              # so it is handled explicitly rather than through apply_to_file.
              path = repo / CORE_TEXT
              original = path.read_text(encoding="utf-8").replace("\r\n", "\n")
              if PATCH_MARKER in original:
                  text = original
                  written = False
              else:
                  text = replace_once(original, CORE_TEXT_OLD_IMPORT, CORE_TEXT_NEW_IMPORT,
                                      "the ui_font import")
                  text = replace_once(text, CORE_TEXT_OLD_SITE, CORE_TEXT_NEW_SITE,
                                      "the font_from_uifont(env, font) sites",
                                      count=CORE_TEXT_OLD_SITE_COUNT)
                  written = True
              check(CORE_TEXT, text)
              if written:
                  with open(path, "w", encoding="utf-8", newline="\n") as output:
                      output.write(text)
                  print("Wrote {}".format(path))
              else:
                  print("{} is unchanged".format(path))
          
              print("Patch L (v14): the CJK/Arabic fallback is now reachable from the CoreText "
                    "text paths (CTLineDraw and the two measurement calls, plus the framesetter "
                    "size), through the one text-aware lookup in ui_font.rs, and the glyph-id "
                    "draw entry points report the .notdef runs they cannot repair.")
          
          
          if __name__ == "__main__":
              main()
          PATCH_V14_CJK_TEXT_PY

      - name: Check that the patches really landed, including the touch mapping and the
             CJK/Arabic text fallback
        run: |
          set -eu
          # Self-check for the CoreFoundation patch (A), the logging patches (B), the
          # bundle-root resource fallback (C, v4), the EUC-KR decoding patch (D, v5), the
          # file-access / texture-upload tracing (E, v6), the filesystem probe / write
          # tracing (F, v7), the path-origin tracing (G, v8), the nil-component stack
          # trace (H, v9), the `__vsprintf_chk` signature fix (I, v10), the guest-
          # filesystem resource read (K, v12), the shared touch/render geometry (v13) and the
          # CJK/Arabic text fallback (L, v14).
          # Run from the root of the checkout. Fails the build if any of them did not land,
          # so a run can never upload a dylib that still logs the old way, still hides the
          # lookup's directory/lproj, is still missing the resource-lookup fix, still
          # sends the app's EUC-KR text through the UTF-8 default, still prints only the
          # first texture upload of a run, still cannot show the probe and write calls
          # that explain a path which is opened over and over but is never a file, still
          # cannot say which guest call produced the nil path component that turned that
          # path into a directory, or still reports only the single PC/return-address pair
          # that the v8 device log proved is not a caller, or still left the buffer of a
          # `_FORTIFY_SOURCE` printf all-zero because `__vsprintf_chk` read the wrong
          # argument, or still read the bytes that
          # CFURLCreateDataAndPropertiesFromResource returns through the host filesystem
          # instead of the emulated one, or still lays out and rasterises a CJK or Arabic
          # string with a Latin-only face on the CoreText paths, or still maps host touches
          # through its own copy of the letterbox rectangle instead of the one shared in
          # src/window/geometry.rs.
          
          core=src/frameworks/core_foundation/cf_url.rs
          definitions=$(grep -c "fn CFURLCreateDataAndPropertiesFromResource(" "$core" || true)
          exports=$(grep -c "export_c_func!(CFURLCreateDataAndPropertiesFromResource" "$core" || true)
          echo "patch A: definitions=$definitions exports=$exports"
          if [ "$definitions" != "1" ] || [ "$exports" != "1" ]; then
            echo "::error::patch A did not apply cleanly (definitions=$definitions, exports=$exports)"
            exit 1
          fi
          
          # Every marker below is a string whose occurrence count in the patched file the
          # corresponding patch script fixes: the ones an edit inserts must appear the
          # stated number of times, and any marker with expected 0 asserts that a form the
          # patch is supposed to have replaced is really gone. The counts are compared, so
          # a marker that appears even once too often fails the build.
          check_marker() {
            target=$1
            marker=$2
            expected=$3
            count=$(grep -c -F -- "$marker" "$target" || true)
            echo "  $target: '$marker' x$count (expected $expected)"
            if [ "$count" != "$expected" ]; then
              echo "::error::$target: '$marker' appears $count time(s), expected $expected"
              exit 1
            fi
          }
          
          bundle=src/frameworks/foundation/ns_bundle.rs
          check_marker "$bundle" "let path_debug = ns_string::to_rust_string(env, path);" 1
          check_marker "$bundle" "let data_path_debug = ns_string::to_rust_string(env, data_path);" 1
          check_marker "$bundle" "let name_debug = ns_string::to_rust_string(env, name);" 1
          check_marker "$bundle" "let extension_debug = ns_string::to_rust_string(env, extension);" 1
          # Patch C v4 (C2): the missing-resource log names the lookup's directory and
          # lproj, and both are converted with the nil-safe helper.
          check_marker "$bundle" "let directory_debug = ns_string::to_rust_string(env, directory);" 1
          check_marker "$bundle" "let lproj_debug = ns_string::to_rust_string(env, lproj);" 1
          check_marker "$bundle" "(name={:?} extension={:?} directory={:?} lproj={:?})" 1
          
          # Patch C v4 (C1): one bundle-root retry in each pathForResource:ofType:inDirectory:
          # implementation (the + class method and the - instance method), so exactly two,
          # and both must pass nil for *both* lproj and directory - only that reaches the
          # bundle root. The positive marker carries the `let bundle_root_path =` prefix.
          check_marker "$bundle" "let bundle_root_path = path_for_resource_helper(env, this, name, nil, nil, extension);" 2
          # Negative assertion: the v3 form of the same retry dropped only lproj and kept
          # passing the caller's `directory`, which recomputed the path the function had
          # already tried and therefore never reached the bundle root. It must be gone.
          # The `let bundle_root_path =` prefix keeps this marker on the fallback call
          # alone: the two pre-existing calls at the top of both implementations are
          # `let path = path_for_resource_helper(env, this, name, nil, directory,
          # extension);` and do not match it.
          check_marker "$bundle" "let bundle_root_path = path_for_resource_helper(env, this, name, nil, directory, extension);" 0
          
          posix=src/libc/posix_io.rs
          check_marker "$posix" "let read_fd_path: Option<String> = file.path.clone();" 1
          check_marker "$posix" "let lseek_fd_path: Option<String> = file.path.clone();" 1
          check_marker "$posix" "called on a guest directory" 2
          check_marker "$posix" "returning {} (guest path: {:?})" 1
          check_marker "$posix" "returning -1 (guest path: {:?})" 1
          
          fs=src/fs.rs
          check_marker "$fs" "no path or fd at this layer" 1
          
          echo "== the pre-patch log calls must be gone =="
          python3 - <<'CHECK_OLD_LOGS'
          import pathlib
          import sys
          
          # The exact text patch B replaced. If any of it is still there the patch did
          # not land and a run would upload a core that logs the same useless pointers.
          stale = {
              "src/frameworks/foundation/ns_bundle.rs": [
                  '''    log!(
                  "NSBundle resource lookup: {:?} missing, Unity Data fallback {:?} exists={}",
                  path,
                  data_path,
                  data_path_exists
              );
          ''',
              ],
              "src/libc/posix_io.rs": [
                  r'''            log!(
                          "Warning: read({:?}, {:?}, {:#x}) encountered error {:?}, \
                           returning {}",
                          fd,
                          buffer,
                          size,
                          e,
                          res
                      );
          ''',
              ],
              "src/fs.rs": [
                  '''                log!("Warning: Seeking a directory as a guest file!");
          ''',
              ],
          }
          
          problems = []
          for name, texts in stale.items():
              content = pathlib.Path(name).read_text(encoding="utf-8")
              for text in texts:
                  if text in content:
                      problems.append("{}: still contains the pre-patch log call from line {:?}".format(
                          name, text.strip().splitlines()[0]))
          
          for name in stale:
              content = pathlib.Path(name).read_text(encoding="utf-8")
              if content.count("{") != content.count("}"):
                  problems.append("{}: braces are unbalanced ({} '{{' vs {} '}}')".format(
                      name, content.count("{"), content.count("}")))
          
          if problems:
              for problem in problems:
                  print("::error::" + problem)
              sys.exit(1)
          print("no pre-patch log call remains and the patched files are brace-balanced")
          CHECK_OLD_LOGS
          
          echo "== patch D (v5): EUC-KR =="
          # Patch D gives the emulator the Korean text encoding the app asks for. Each
          # marker below is a code line patch D inserts, with the count the patch script
          # guarantees, so a missing or a duplicated insertion fails the build. The plain
          # `| kCFStringEncodingEUC_KR` marker is expected twice: it is a prefix of the
          # `_HighBit` whitelist line as well as the name of the plain one.
          cfstring=src/frameworks/core_foundation/cf_string.rs
          nsstring=src/frameworks/foundation/ns_string.rs
          check_marker "$cfstring" "pub const kCFStringEncodingEUC_KR: CFStringEncoding = 0x940;" 1
          check_marker "$cfstring" "pub const kCFStringEncodingEUC_KR_HighBit: CFStringEncoding = 0x80000940;" 1
          check_marker "$cfstring" "kCFStringEncodingEUC_KR => ns_string::NSKoreanEUCStringEncoding," 1
          check_marker "$cfstring" "kCFStringEncodingEUC_KR_HighBit => ns_string::NSKoreanEUCStringEncoding," 1
          check_marker "$cfstring" "ns_string::NSKoreanEUCStringEncoding => kCFStringEncodingEUC_KR," 1
          check_marker "$cfstring" "| kCFStringEncodingEUC_KR" 2
          check_marker "$cfstring" "| kCFStringEncodingEUC_KR_HighBit" 1
          # Requirement: the unsupported-encoding fallback must survive patch D. Other
          # encodings still need it; 0x940 stops reaching it because of the arms above.
          check_marker "$cfstring" "Warning: Unhandled CFStringEncoding {:#x}, defaulting to UTF-8" 1
          check_marker "$nsstring" "pub const NSKoreanEUCStringEncoding: NSUInteger = 0x80000940;" 1
          check_marker "$nsstring" "        NSKoreanEUCStringEncoding => encoding_rs::EUC_KR," 1
          
          python3 - <<'CHECK_EUCKR'
          import pathlib
          import sys
          
          # Structural checks that a substring count cannot make: every new arm has to sit
          # inside the function it belongs to, ahead of that function's fallback, and each
          # new definition has to exist exactly once as a whole line, so an indented copy
          # or an extra insertion somewhere else cannot satisfy them.
          problems = []
          
          cf = pathlib.Path("src/frameworks/core_foundation/cf_string.rs").read_text(encoding="utf-8")
          ns = pathlib.Path("src/frameworks/foundation/ns_string.rs").read_text(encoding="utf-8")
          
          
          def expect_lines(text, where, wanted):
              lines = text.splitlines()
              for line, count in wanted:
                  got = lines.count(line)
                  if got != count:
                      problems.append("{}: {:?} appears {} time(s) as a line, expected {}".format(
                          where, line.strip()[:70], got, count))
          
          
          def expect_order(text, where, new_code, before, inside):
              base = text.index(inside)
              try:
                  a = text.index(new_code, base)
                  b = text.index(before, base)
              except ValueError as error:
                  problems.append("{}: {}".format(where, error))
                  return
              if not a < b:
                  problems.append("{}: {:?} does not come before {:?}".format(
                      where, new_code[:60], before[:60]))
          
          
          # D1: the two spellings of the encoding, once each.
          expect_lines(cf, "cf_string.rs D1", [
              ("pub const kCFStringEncodingEUC_KR: CFStringEncoding = 0x940;", 1),
              ("pub const kCFStringEncodingEUC_KR_HighBit: CFStringEncoding = 0x80000940;", 1),
          ])
          # D2: both spellings map to the new NSStringEncoding, inside
          # CFStringConvertEncodingToNSStringEncoding and ahead of its UTF-8 fallback.
          expect_lines(cf, "cf_string.rs D2", [
              ("        kCFStringEncodingEUC_KR => ns_string::NSKoreanEUCStringEncoding,", 1),
              ("        kCFStringEncodingEUC_KR_HighBit => ns_string::NSKoreanEUCStringEncoding,", 1),
          ])
          expect_order(cf, "cf_string.rs D2 (arm inside the conversion function)",
                       "kCFStringEncodingEUC_KR => ns_string::NSKoreanEUCStringEncoding,",
                       "Warning: Unhandled CFStringEncoding",
                       "pub fn CFStringConvertEncodingToNSStringEncoding")
          # D3: the reverse mapping, inside its own function.
          expect_lines(cf, "cf_string.rs D3", [
              ("        ns_string::NSKoreanEUCStringEncoding => kCFStringEncodingEUC_KR,", 1),
          ])
          expect_order(cf, "cf_string.rs D3 (arm inside the reverse function)",
                       "ns_string::NSKoreanEUCStringEncoding => kCFStringEncodingEUC_KR,",
                       "Warning: Unhandled NSStringEncoding",
                       "fn CFStringConvertNSStringEncodingToEncoding")
          # D4: both spellings answer true from CFStringIsEncodingAvailable. The body is
          # brace-free, so the first closing brace ends the function.
          available = cf[cf.index("fn CFStringIsEncodingAvailable"):].split("}", 1)[0].splitlines()
          for line in ("            | kCFStringEncodingEUC_KR",
                       "            | kCFStringEncodingEUC_KR_HighBit"):
              if line not in available:
                  problems.append("cf_string.rs D4: {:?} is not in CFStringIsEncodingAvailable".format(
                      line.strip()))
          
          # D5/D6: the constant and the codec, once each, with the codec inside
          # encoding_rs_for - the helper both the decode and the encode path reach for -
          # ahead of that helper's `_ => return None`.
          expect_lines(ns, "ns_string.rs D5/D6", [
              ("pub const NSKoreanEUCStringEncoding: NSUInteger = 0x80000940;", 1),
              ("        NSKoreanEUCStringEncoding => encoding_rs::EUC_KR,", 1),
          ])
          expect_order(ns, "ns_string.rs D6 (codec inside encoding_rs_for)",
                       "NSKoreanEUCStringEncoding => encoding_rs::EUC_KR,",
                       "_ => return None,",
                       "fn encoding_rs_for")
          # D7: the C-string friendly list, a block of bare identifiers.
          list_start = ns.index("const C_STRING_FRIENDLY_ENCODINGS")
          list_lines = ns[list_start:ns.index("];", list_start)].splitlines()
          korean = "    NSKoreanEUCStringEncoding,"
          japanese = "    NSJapaneseEUCStringEncoding,"
          if list_lines.count(korean) != 1:
              problems.append(
                  "ns_string.rs D7: NSKoreanEUCStringEncoding is listed {} time(s) in C_STRING_FRIENDLY_ENCODINGS, expected 1".format(
                      list_lines.count(korean)))
          if not any(one == japanese and two == korean for one, two in zip(list_lines, list_lines[1:])):
              problems.append(
                  "ns_string.rs D7: expected NSKoreanEUCStringEncoding right after NSJapaneseEUCStringEncoding")
          
          for name in ("src/frameworks/core_foundation/cf_string.rs", "src/frameworks/foundation/ns_string.rs"):
              content = pathlib.Path(name).read_text(encoding="utf-8")
              if content.count("{") != content.count("}"):
                  problems.append("{}: braces are unbalanced".format(name))
          
          if problems:
              for problem in problems:
                  print("::error::" + problem)
              sys.exit(1)
          print("patch D: both EUC-KR spellings, the two conversion arms, the availability "
                "entry, the NSStringEncoding constant and the encoding_rs codec are all in place")
          CHECK_EUCKR
          
          echo "== patch E (v6): guest file access and texture uploads =="
          # Every marker below is a line patch E inserts, or - for the two markers with an
          # expected count of 0 - a pre-patch line it replaces. The counts are exact, so a
          # duplicated or missing insertion fails the build.
          trace=src/fs_trace.rs
          if [ ! -f "$trace" ]; then
            echo "::error::patch E did not create $trace"
            exit 1
          fi
          check_marker "$trace" "pub fn note_open(path: &str, ok: bool, flags: i32)" 1
          check_marker "$trace" "pub fn note_read(path: &str, bytes: Option<usize>)" 1
          check_marker "$trace" "pub fn note_tex_upload(" 1
          check_marker "$trace" "pub fn note_compressed_tex_upload(" 1
          check_marker "$trace" "pub fn note_draw()" 1
          check_marker "$trace" "pub fn print_summary(frames: u64)" 1
          check_marker "$trace" "FSOPEN ok  {}" 1
          check_marker "$trace" "FSOPEN ERR {} flags={:#x} err=guest-fs" 1
          check_marker "$trace" "FSREAD ok  {} bytes={}" 1
          check_marker "$trace" "FSREAD ERR {} err=guest-fs" 1
          check_marker "$trace" "TEXUPLOAD {}x{} internal=0x{:x} fmt=0x{:x} type=0x{:x} lvl={}" 1
          check_marker "$trace" "TEXUPLOAD-COMPRESSED {}x{} internal=0x{:x} image_size={} lvl={}" 1
          check_marker "$trace" "FS SUMMARY frames={} tex_uploads={} tex_uploads_compressed={} gl_draws={} opens_ok={} opens_err={} reads_ok={} reads_err={}" 1
          check_marker "$trace" "const TRACE_BUDGET: u32 = 2000;" 1
          check_marker "$trace" "const TRACE_SAMPLE: u32 = 100;" 1
          
          check_marker src/lib.rs "mod fs_trace;" 1
          check_marker src/libc/posix_io.rs "crate::fs_trace::note_open(&actual_path_string, res != -1, flags);" 1
          check_marker src/fs.rs "let bytes_read = result.as_ref().ok().map(|bytes| bytes.len());" 1
          check_marker src/fs.rs "crate::fs_trace::note_read(path.as_ref().as_str(), bytes_read);" 1
          check_marker src/fs.rs "fn read_inner<P: AsRef<GuestPath>>(&self, path: P) -> Result<Vec<u8>, ()> {" 1
          check_marker src/frameworks/opengles/gles_guest.rs "crate::fs_trace::note_tex_upload(width, height, internalformat as u32, format, type_, level);" 1
          check_marker src/frameworks/opengles/gles_guest.rs "crate::fs_trace::note_compressed_tex_upload(width, height, internalformat, image_size, level);" 1
          check_marker src/frameworks/opengles/gles_guest.rs "crate::fs_trace::note_draw();" 2
          check_marker src/frameworks/opengles/eagl.rs "crate::fs_trace::print_summary(n);" 1
          # The once-only texture upload logs are exactly what patch E replaces; both must
          # be gone, while the pre-existing draw traces (which patch E only counts beside)
          # must survive untouched.
          check_marker src/frameworks/opengles/gles_guest.rs "First glTexImage2D(" 0
          check_marker src/frameworks/opengles/gles_guest.rs "First glCompressedTexImage2D(" 0
          check_marker src/frameworks/opengles/gles_guest.rs "First glDrawArrays(" 1
          check_marker src/frameworks/opengles/gles_guest.rs "First glDrawElements(" 1
          
          python3 - <<'CHECK_FSTRACE'
          import pathlib
          import sys
          
          # Structural checks a substring count cannot make: each trace call has to sit
          # where it can only observe the emulated result, the moved Fs::read body has to
          # be intact, and the trace module itself has to be incapable of changing
          # emulation (no unsafe, nothing that panics, no I/O of its own).
          problems = []
          
          trace = pathlib.Path("src/fs_trace.rs").read_text(encoding="utf-8")
          posix = pathlib.Path("src/libc/posix_io.rs").read_text(encoding="utf-8")
          fs = pathlib.Path("src/fs.rs").read_text(encoding="utf-8")
          gles = pathlib.Path("src/frameworks/opengles/gles_guest.rs").read_text(encoding="utf-8")
          eagl = pathlib.Path("src/frameworks/opengles/eagl.rs").read_text(encoding="utf-8")
          
          for bad in ("unsafe", "unwrap(", "expect(", "panic!", "todo!", "unimplemented!",
                      "std::process", "std::fs::"):
