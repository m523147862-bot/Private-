          ///
          /// A device run of this app is only a few hundred frames long, so patch E's
          /// `n % 600 == 0` tick never fired there. This prints at frame 60 and then
          /// every 300 frames. Multiples of 600 are left to patch E's tick (which this
          /// patch must not edit), so no frame ever prints the shared `FS SUMMARY` line
          /// twice; the union of the two ticks is exactly 60, 300, 600, 900, ...
          pub fn note_frame(frame: u64) {
