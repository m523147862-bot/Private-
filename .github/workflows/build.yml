                      problems.append("src/frameworks/foundation/ns_string.rs: the successful-read trace of {} is inside the "
                                      "match instead of after it".format(signature))
                  uses = [position for position in (body.find("Cow::Owned(bytes)"), body.find("let len = bytes.len();"))
