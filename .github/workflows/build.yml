          //! FSLIST <guest path> n=<count>                FSLIST ERR <guest path> err=guest-fs
          //! FSATTR <guest path> ok=1 isdir=0 size=<n>    FSATTR ERR <guest path> err=guest-fs
          //! FSREADABLE <guest path> ok=<0|1>             FSWRITABLE <guest path> ok=<0|1>
          //! PATHJOIN WARNING base="<path>" component=<nil|empty>
          //! FSWRITE <guest path> flags=0x<hex> ok=<0|1> [err=guest-fs]
          //! FSCREATE <guest path> ok=<0|1> [err=guest-fs]
          //! FSOPEN ERR-PC <guest path> pc=0x<hex>
