          main_exit = env_rs.index("Main thread exited normally")
          if env_rs.index("crate::fs_probe::print_final_summary();", main_exit) - main_exit > 400:
              problems.append("src/environment.rs: no final summary near the main-thread exit")
          host_exit = env_rs.index("Returning to the iOS host library.")
          if env_rs.index("crate::fs_probe::print_final_summary();", host_exit) - host_exit > 400:
              problems.append("src/environment.rs: no final summary near the host stop path")

          for name in ("src/lib.rs", "src/libc/posix_io.rs", "src/fs.rs",
                       "src/frameworks/foundation/ns_file_manager.rs",
                       "src/frameworks/foundation/ns_string.rs",
                       "src/frameworks/opengles/eagl.rs", "src/environment.rs",
                       "src/fs_probe.rs"):
