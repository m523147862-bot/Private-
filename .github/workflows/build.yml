          write_at = fm.index("env.mem.write(is_dir_ptr, is_dir);", is_dir_at)
          trace_at = fm.index("crate::fs_probe::note_exists(&path_str, true, Some(is_dir));", write_at)
          if not is_dir_at < write_at < trace_at:
              problems.append("ns_file_manager.rs: the isDirectory trace does not follow the value it reports")

          # F5: the warning is inside stringByAppendingPathComponent: and ahead of the call
          # that actually drops the empty component.
          append_impl = nsstr[nsstr.index("- (id)stringByAppendingPathComponent:(id)component {"):]
          append_impl = append_impl[:append_impl.index("\n}")]
          for needed in ("let component_str = to_rust_string(env, component);",
                         "if component.is_null() || component_str.is_empty() {",
                         "crate::fs_probe::note_path_component(&base_str, component.is_null());"):
