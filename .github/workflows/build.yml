              # cheapest proof is the markers the v9 self-check asserts; the load-bearing
              # ones at the sites patch H also touches are re-checked here.
              ns_string = texts[NS_STRING]
              for name, marker, expected in (
                  ("F5 path-join warning", "crate::fs_probe::note_path_component(&base_str, component.is_null());", 1),
                  ("G2 path-join origin", "crate::fs_origin::note_path_component_origin(", 1),
                  ("H2 path-join stack", "crate::fs_origin::note_path_component_stack(", 1),
              ):
