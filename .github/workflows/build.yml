          write_body = fs[fs.index("pub fn write<P: AsRef<GuestPath>>(&mut self, path: P, data: &[u8]) -> Result<(), ()> {"):]
          write_body = write_body[:write_body.index("\n    }")]
          for line in ("        let mut options = GuestOpenOptions::new();",
                       "        options.write().create().truncate();",
                       "            .open_with_options(guest_path, options)",
                       "            .and_then(|mut file| file.write_all(data).map_err(|_| ()));"):
