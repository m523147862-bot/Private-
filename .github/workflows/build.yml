          /// the call site (the same value `environment.rs` calls `svc_pc + 4`).
          pub fn note_open_failure_pc(path: &str, pc: u32) {
              if !should_print(path, true) {
                  return;
              }
              log!("FSOPEN ERR-PC {} pc={:#010x}", path, pc);
          }

