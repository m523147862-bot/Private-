          nsstr = pathlib.Path("src/frameworks/foundation/ns_string.rs").read_text(encoding="utf-8")
          eagl = pathlib.Path("src/frameworks/opengles/eagl.rs").read_text(encoding="utf-8")
          env_rs = pathlib.Path("src/environment.rs").read_text(encoding="utf-8")

          # The probe module must be a pure logger.
          for bad in ("unsafe", "unwrap(", "expect(", "panic!", "todo!", "unimplemented!",
                      "std::process::", "std::fs::", "Environment", "env."):
              if bad in probe:
                  problems.append("src/fs_probe.rs: contains {!r}, which instrumentation must not use".format(bad))

