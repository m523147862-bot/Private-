            marker=$2
            expected=$3
            count=$(grep -c -F -- "$marker" "$target" || true)
            echo "  $target: '$marker' x$count (expected $expected)"
            if [ "$count" != "$expected" ]; then
              echo "::error::$target: '$marker' appears $count time(s), expected $expected"
              exit 1
            fi
          }

          bundle=src/frameworks/foundation/ns_bundle.rs
          check_marker "$bundle" "let path_debug = ns_string::to_rust_string(env, path);" 1
          check_marker "$bundle" "let data_path_debug = ns_string::to_rust_string(env, data_path);" 1
          check_marker "$bundle" "let name_debug = ns_string::to_rust_string(env, name);" 1
          check_marker "$bundle" "let extension_debug = ns_string::to_rust_string(env, extension);" 1
          # Patch C v4 (C2): the missing-resource log names the lookup's directory and
          # lproj, and both are converted with the nil-safe helper.
