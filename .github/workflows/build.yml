          fi
          check_marker "$origin" "pub fn note_path_component_origin(base: &str, component_is_nil: bool, pc: u32, ret: u32)" 1
          check_marker "$origin" "pub fn note_defaults_query(selector: &str, key: &str, summary: &str)" 1
          check_marker "$origin" "pub fn note_read_file(kind: &str, path: &str, size: Option<usize>)" 1
          check_marker "$origin" "pub fn note_special_file(path: &str, bytes: &[u8])" 1
          check_marker "$origin" "PATHJOIN ORIGIN base={:?} component=<{}> pc={:#010x} ret={:#010x}" 1
          check_marker "$origin" "NSDEFAULTS {} key={:?} -> {}" 1
          check_marker "$origin" "NSREAD {} {} -> nil" 1
          check_marker "$origin" "NSREAD {} {} -> ok(len={})" 1
          check_marker "$origin" "FSBYTES {} len={} hex={}" 1
          # The G1 rate limit: the defaults policy the task asked for (first 8 per
          # key+result, then 1 in 100), the per-kind heads, and the three watched files.
          check_marker "$origin" "const DEFAULTS_HEAD: u32 = 8;" 1
          check_marker "$origin" "const DEFAULTS_SAMPLE: u32 = 100;" 1
          check_marker "$origin" "const ORIGIN_HEAD: u32 = 16;" 1
          check_marker "$origin" "const ORIGIN_SAMPLE: u32 = 25;" 1
          check_marker "$origin" "const READ_HEAD: u32 = 4;" 1
          check_marker "$origin" "const SPECIAL_HEAD: u32 = 4;" 1
          check_marker "$origin" "const BYTES_PREFIX: usize = 32;" 1
          check_marker "$origin" "const GLOBAL_BUDGET: u32 = 3000;" 1
          check_marker "$origin" "const GLOBAL_SAMPLE: u32 = 100;" 1
          check_marker "$origin" "const MAX_TRACKED_KEYS: usize = 4096;" 1
          check_marker "$origin" 'const WATCHED_FILES: [&str; 3] = ["DnfSlot", "DnfOpt", "com.nexonmobile.dnfswordman.plist"];' 1
          # Wiring: every new function has a real call site, and patch G never reaches
          # into patch F's module (F's module and its rate limit stay as v7 had them).
          check_marker src/lib.rs "mod fs_origin;" 1
          check_marker "$origin" "fs_probe" 0
          check_marker src/frameworks/foundation/ns_string.rs "crate::fs_origin::note_path_component_origin(" 1
          check_marker src/frameworks/foundation/ns_string.rs 'crate::fs_origin::note_read_file("NSString", &path_str, None);' 3
          check_marker src/frameworks/foundation/ns_string.rs 'crate::fs_origin::note_read_file("NSString", &path_str, Some(bytes.len()));' 3
          check_marker src/frameworks/foundation/ns_data.rs 'crate::fs_origin::note_read_file("NSData", &path_str, None);' 1
          check_marker src/frameworks/foundation/ns_data.rs 'crate::fs_origin::note_read_file("NSData", &path_str, Some(bytes.len()));' 1
          check_marker src/fs.rs "crate::fs_origin::note_special_file(path.as_ref().as_str(), bytes);" 1
          defaults=src/frameworks/foundation/ns_user_defaults.rs
          check_marker "$defaults" 'crate::fs_origin::note_defaults_query("objectForKey:", &key_str, &defaults_value_summary(env, res));' 1
          check_marker "$defaults" 'crate::fs_origin::note_defaults_query("stringForKey:", &key_str, &defaults_value_summary(env, val));' 1
          check_marker "$defaults" 'crate::fs_origin::note_defaults_query("arrayForKey:", &key_str, &defaults_value_summary(env, val));' 1
          check_marker "$defaults" 'crate::fs_origin::note_defaults_query("dictionaryForKey:", &key_str, &defaults_value_summary(env, val));' 1
          check_marker "$defaults" 'crate::fs_origin::note_defaults_query("boolForKey:", &key_str, &defaults_value_summary(env, val));' 1
          check_marker "$defaults" 'crate::fs_origin::note_defaults_query("integerForKey:", &key_str, &defaults_value_summary(env, val));' 1
          check_marker "$defaults" "fn defaults_key_string(env: &mut Environment, key: id) -> String" 1
          check_marker "$defaults" "fn defaults_value_summary(env: &mut Environment, val: id) -> String" 1
          # Patch F's warning at the shared path-join site is still there exactly once:
