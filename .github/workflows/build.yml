          marker_warning = "crate::fs_probe::note_path_component(&base_str, component.is_null());"
          marker_origin = "crate::fs_origin::note_path_component_origin("
          marker_build = "let res = path_algorithms::string_by_appending_path_component"
          append_impl = nsstr[nsstr.index("- (id)stringByAppendingPathComponent:(id)component {"):]
          append_impl = append_impl[:append_impl.index("\n}")]
          for needed in ("if component.is_null() || component_str.is_empty() {", marker_warning,
                         marker_origin, marker_build):
