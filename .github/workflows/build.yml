              /// `user_data` arguments have the same meaning as the last two arguments to
              /// `pthread_create`.
              pub fn new_thread(
          ''',
                  ENV_METHOD
                  + '''    /// Create a new thread and return its ID. The `start_routine` and
              /// `user_data` arguments have the same meaning as the last two arguments to
              /// `pthread_create`.
              pub fn new_thread(
          ''',
                  1,
                  ("pub(crate) fn guest_stack_frames(&self, max: usize) -> Vec<u32> {",),
