          wrapper = fs[fs.index("pub fn read<P: AsRef<GuestPath>>(&self, path: P) -> Result<Vec<u8>, ()> {"):]
          wrapper = wrapper[:wrapper.index("\n    fn read_inner")]
          if "self.read_inner(path.as_ref())" not in wrapper or "\n        result\n" not in wrapper:
              problems.append("src/fs.rs: Fs::read is no longer a pass-through wrapper")
          inner = fs[fs.index("fn read_inner<P: AsRef<GuestPath>>(&self, path: P) -> Result<Vec<u8>, ()> {"):]
          inner = inner[:inner.index("\n    }")]
          for line in ("        let mut file = self.open(path.as_ref())?;",
                       "        let mut result = Vec::new();",
                       "        file.read_to_end(&mut result).map_err(|_| ())?;",
                       "        Ok(result)"):
