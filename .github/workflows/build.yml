# Builds the iOS emulator core (libhyperhle_core.dylib) for Applesauce on a
# GitHub-hosted macOS machine, so the core can be built without owning a Mac.
#
# How to use it: put this file in a repository as .github/workflows/build.yml,
# then open the Actions tab, pick "Build iOS emulator core (dylib)" and press
# "Run workflow". A run takes about 20-40 minutes; the finished dylib is in the
# Artifacts section at the bottom of the run page.
#
# Nothing needs to be forked. The job checks out the upstream Applesauce
# repository at a fixed commit on the runner itself, applies four patches,
# builds the core, verifies the result and uploads it. This file is the only
# file the account running it needs.
