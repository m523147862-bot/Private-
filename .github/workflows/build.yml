          if problems:
              for problem in problems:
                  print("::error::" + problem)
              sys.exit(1)
          print("patch F: the probe/write trace module, all nine NSFileManager probe hooks, "
                "the path-join warning, the write-intent open hook, the whole-file write hook, "
                "the failed-open PC hook, the 60/300-frame summary cadence and the final "
                "summary on both exit paths are in place, and every patch F call site can only "
                "observe, never change, the emulated result")
          CHECK_FSPROBE

          echo "== patch G (v8): where the nil path component comes from =="
          # The four new functions, the five line formats, the rate-limit constants and
          # the call site of every one of them. The counts are exact, so a duplicated or
          # missing insertion fails the build. The A-F assertions above are unchanged: the
          # v8 script is the v7 script with this section appended.
