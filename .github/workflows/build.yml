          PATCH_H_PY

      - name: Check that the patches really landed
        run: |
          set -eu
          # Self-check for the CoreFoundation patch (A), the logging patches (B), the
          # bundle-root resource fallback (C, v4), the EUC-KR decoding patch (D, v5), the
          # file-access / texture-upload tracing (E, v6), the filesystem probe / write
          # tracing (F, v7), the path-origin tracing (G, v8) and the nil-component stack
          # trace (H, v9).
          # Run from the root of the checkout. Fails the build if any of them did not land,
          # so a run can never upload a dylib that still logs the old way, still hides the
          # lookup's directory/lproj, is still missing the resource-lookup fix, still
          # sends the app's EUC-KR text through the UTF-8 default, still prints only the
          # first texture upload of a run, still cannot show the probe and write calls
          # that explain a path which is opened over and over but is never a file, still
          # cannot say which guest call produced the nil path component that turned that
          # path into a directory, or still reports only the single PC/return-address pair
          # that the v8 device log proved is not a caller.

          core=src/frameworks/core_foundation/cf_url.rs
          definitions=$(grep -c "fn CFURLCreateDataAndPropertiesFromResource(" "$core" || true)
          exports=$(grep -c "export_c_func!(CFURLCreateDataAndPropertiesFromResource" "$core" || true)
          echo "patch A: definitions=$definitions exports=$exports"
          if [ "$definitions" != "1" ] || [ "$exports" != "1" ]; then
            echo "::error::patch A did not apply cleanly (definitions=$definitions, exports=$exports)"
            exit 1
