          Line formats:

          ```text
          PATHJOIN STACK base="<path>" component=<nil|empty>
          #0 0x<hex> #1 0x<hex> ... #11 0x<hex>
          NSDEFAULTSSET <selector> key="<key>" <- <nil|str(len=N)|<class name>|removed>
          PATHFOUND <guest path>
