          if "fs_origin" in inner:
              problems.append("src/fs.rs: patch G touched read_inner")

          # G0: the module is declared after the log macro and beside patch F's module.
          if not lib_rs.index("mod log;") < lib_rs.index("mod fs_origin;") < lib_rs.index("mod fs_probe;"):
              problems.append("src/lib.rs: mod fs_origin; is not between mod log; and mod fs_probe;")

          for name in ("src/lib.rs", "src/fs.rs", "src/fs_origin.rs",
                       "src/frameworks/foundation/ns_string.rs",
                       "src/frameworks/foundation/ns_data.rs",
                       "src/frameworks/foundation/ns_user_defaults.rs"):
              content = pathlib.Path(name).read_text(encoding="utf-8")
              if content.count("{") != content.count("}"):
                  problems.append("{}: braces are unbalanced".format(name))

          if problems:
              for problem in problems:
                  print("::error::" + problem)
              sys.exit(1)
          print("patch G: the path-join origin line (guest PC + return address) sits beside patch F's "
                "warning and before the path is built, all six NSUserDefaults lookups report their key and "
                "result, both arms of the four whole-file readers are named, the watched-file byte dump is "
                "inside patch E's read wrapper with read_inner untouched, the origin module is a pure logger "
                "that does not touch patch F's module, and every patch G call site can only observe, never "
                "change, the emulated result")
          CHECK_FSORIGIN

          echo "== patch H (v9): the guest call stack at the nil path component =="
          # The three new functions, the four line formats and the rate-limit constants of
          # patch H, plus the call site of every one of them. The counts are exact, so a
          # duplicated or missing insertion fails the build. The A-G assertions above are
          # unchanged: the v9 script is the v8 script with this section appended.
          origin=src/fs_origin.rs
          environment=src/environment.rs
          check_marker "$environment" "pub(crate) fn guest_stack_frames(&self, max: usize) -> Vec<u32>" 1
          check_marker "$origin" "pub fn note_path_component_stack(base: &str, component_is_nil: bool, frames: &[u32])" 1
          check_marker "$origin" "pub fn note_defaults_write(selector: &str, key: &str, summary: &str)" 1
          check_marker "$origin" "pub fn note_path_found(path: &str)" 1
          check_marker "$origin" "PATHJOIN STACK base={:?} component=<{}>" 1
          check_marker "$origin" "NSDEFAULTSSET {} key={:?} <- {}" 1
          check_marker "$origin" "PATHFOUND {}" 1
          check_marker "$origin" "const STACK_TRACES_MAX: u32 = 3;" 1
          check_marker "$origin" "const FOUND_HEAD: u32 = 40;" 1
          check_marker "$origin" "const FOUND_SAMPLE: u32 = 100;" 1
          # Wiring: every new function has a real call site, the stack comes from the
          # environment's own unwinder, and patch H adds its lines to patch G's module
          # without reaching into patch F's.
          check_marker src/frameworks/foundation/ns_string.rs "crate::fs_origin::note_path_component_stack(" 1
          check_marker src/frameworks/foundation/ns_string.rs "&env.guest_stack_frames(12)," 1
          defaults=src/frameworks/foundation/ns_user_defaults.rs
          check_marker "$defaults" 'crate::fs_origin::note_defaults_write("setObject:forKey:", ' 1
          check_marker "$defaults" 'crate::fs_origin::note_defaults_write("removeObjectForKey:", ' 1
          check_marker "$defaults" 'crate::fs_origin::note_defaults_write("setBool:forKey:", ' 1
          check_marker "$defaults" 'crate::fs_origin::note_defaults_write("setInteger:forKey:", ' 1
          check_marker src/frameworks/foundation/ns_bundle.rs "crate::fs_origin::note_path_found(" 4
          # The mechanism patch H reuses must still be there: patch H leaves the panic
          # backtrace alone and adds nothing to patch F's module.
          check_marker "$environment" "fn stack_trace_for_thread(&self, tid: usize) {" 1
          check_marker "$environment" '"Attempting to produce stack trace for current thread (#{}):"' 1
          check_marker "$origin" "fs_probe" 0

          python3 - <<'CHECK_FSSTACK'
          import pathlib
          import sys

          # The checks a substring count cannot make: the stack line has to sit at the
          # shared path-join site, after patch F's warning and patch G's origin line and
          # before the path is built; the frames have to come from the environment's own
          # frame-pointer unwinder (the same walk the panic backtrace uses), which must be
          # left intact; the defaults writes have to describe the value they store; the
          # PATHFOUND calls have to sit on the helper's successful returns; and patch G's
          # module must stay unable to change emulation.
          problems = []

          origin = pathlib.Path("src/fs_origin.rs").read_text(encoding="utf-8")
          env_rs = pathlib.Path("src/environment.rs").read_text(encoding="utf-8")
          nsstr = pathlib.Path("src/frameworks/foundation/ns_string.rs").read_text(encoding="utf-8")
          defaults = pathlib.Path("src/frameworks/foundation/ns_user_defaults.rs").read_text(encoding="utf-8")
          bundle = pathlib.Path("src/frameworks/foundation/ns_bundle.rs").read_text(encoding="utf-8")

          # H2/H3/H4: the module is (still) a pure logger, and it does not reach into
          # patch F's module.
          for bad in ("unsafe", "unwrap(", "expect(", "panic!", "todo!", "unimplemented!",
                      "std::process::", "std::fs::", "Environment", "env.", "fs_probe"):
              if bad in origin:
                  problems.append("src/fs_origin.rs: contains {!r}, which instrumentation must not use".format(bad))

          # H2: the stack line sits between patch G's origin line and the call that drops
          # the component, and it is fed from the environment unwinder.
          marker_warning = "crate::fs_probe::note_path_component(&base_str, component.is_null());"
          marker_origin = "crate::fs_origin::note_path_component_origin("
          marker_stack = "crate::fs_origin::note_path_component_stack("
          marker_build = "let res = path_algorithms::string_by_appending_path_component"
          append_impl = nsstr[nsstr.index("- (id)stringByAppendingPathComponent:(id)component {"):]
          append_impl = append_impl[:append_impl.index("\n}")]
          for needed in ("if component.is_null() || component_str.is_empty() {", marker_warning,
                         marker_origin, marker_stack, "&env.guest_stack_frames(12),", marker_build):
              if needed not in append_impl:
                  problems.append("src/frameworks/foundation/ns_string.rs: {!r} is not in stringByAppendingPathComponent:".format(needed))
          if all(needed in append_impl for needed in (marker_warning, marker_origin, marker_stack, marker_build)):
              if not append_impl.index(marker_warning) < append_impl.index(marker_origin) \
                      < append_impl.index(marker_stack) < append_impl.index(marker_build):
                  problems.append("src/frameworks/foundation/ns_string.rs: the stack line is not between patch G's "
                                  "origin line and the call that drops the component")

          # H1: the unwinder is the frame-pointer walk the panic backtrace uses, and the
          # panic backtrace itself is untouched.
          unwinder = env_rs[env_rs.index("pub(crate) fn guest_stack_frames(&self, max: usize) -> Vec<u32> {"):]
          unwinder = unwinder[:unwinder.index("\n    }")]
          for needed in ("self.threads[self.current_thread].stack.clone()",
                         "mem::Ptr::from_bits(regs[abi::FRAME_POINTER])",
                         "if !stack_range.contains(&fp.to_bits()) {",
                         "lr = self.mem.read((fp + 4).cast());",
                         "fp = self.mem.read(fp.cast());",
                         "self.dyld.return_to_host_routine()",
                         "self.dyld.thread_exit_routine()",
                         "frames.push(lr);"):
              if needed not in unwinder:
                  problems.append("src/environment.rs: guest_stack_frames is missing {!r}".format(needed))
          panic_walk = env_rs[env_rs.index("fn stack_trace_for_thread(&self, tid: usize) {"):]
          panic_walk = panic_walk[:panic_walk.index("\n    }")]
          for needed in ("lr = self.mem.read((fp + 4).cast());",
                         "fp = self.mem.read(fp.cast());",
                         'echo_no_panic!(" 0. {:#x} (PC)", pc.addr_with_thumb_bit());'):
              if needed not in panic_walk:
                  problems.append("src/environment.rs: the panic backtrace lost {!r}".format(needed))
          if "guest_stack_frames" in panic_walk:
              problems.append("src/environment.rs: patch H changed the panic backtrace")

          # H3: each defaults write describes the value it is about to store.
          for head, selector, value in (
              ("- (())setObject:(id)object forKey:(id)key { // NSString*", "setObject:forKey:", "defaults_value_summary(env, object)"),
              ("- (())removeObjectForKey:(id)key {", "removeObjectForKey:", '"removed"'),
              ("- (())setBool:(bool)value forKey:(id)key { // NSString *", "setBool:forKey:", "defaults_value_summary(env, num)"),
              ("- (())setInteger:(NSInteger)value forKey:(id)key {", "setInteger:forKey:", "defaults_value_summary(env, num)"),
          ):
              call = 'crate::fs_origin::note_defaults_write("{}", '.format(selector)
              if head not in defaults:
                  problems.append("src/frameworks/foundation/ns_user_defaults.rs: {} is missing".format(selector))
                  continue
              body = defaults[defaults.index(head):]
              body = body[:body.index("\n}")]
              if call not in body:
                  problems.append("src/frameworks/foundation/ns_user_defaults.rs: {} has no write trace".format(selector))
                  continue
              if value not in body:
                  problems.append("src/frameworks/foundation/ns_user_defaults.rs: {} does not summarise the value".format(selector))
              if "let key_str = defaults_key_string(env, key);" not in body:
                  problems.append("src/frameworks/foundation/ns_user_defaults.rs: {} does not use the guarded key helper".format(selector))

          # H4: every successful return of path_for_resource_helper names the path, and
          # each PATHFOUND call stands in front of the return it reports.
          helper = bundle[bundle.index("fn path_for_resource_helper("):]
          for call, ret in (("crate::fs_origin::note_path_found(&exec_path_str);", "return ns_string::from_rust_string(env, exec_path_str);"),
                            ("crate::fs_origin::note_path_found(&found_str);", "return path;"),
                            ("crate::fs_origin::note_path_found(&found_str);", "return data_path;"),
                            ("crate::fs_origin::note_path_found(&full);", "return ns_string::from_rust_string(env, full);")):
              if call not in helper:
                  problems.append("src/frameworks/foundation/ns_bundle.rs: path_for_resource_helper has no {!r}".format(call))
                  continue
              if ret not in helper:
                  problems.append("src/frameworks/foundation/ns_bundle.rs: the return {!r} is gone".format(ret))
                  continue
              if helper.index(call) > helper.index(ret):
                  problems.append("src/frameworks/foundation/ns_bundle.rs: {!r} follows its return".format(call))

          for name in ("src/environment.rs", "src/fs_origin.rs",
                       "src/frameworks/foundation/ns_string.rs",
                       "src/frameworks/foundation/ns_user_defaults.rs",
                       "src/frameworks/foundation/ns_bundle.rs"):
              content = pathlib.Path(name).read_text(encoding="utf-8")
              if content.count("{") != content.count("}"):
                  problems.append("{}: braces are unbalanced".format(name))

          if problems:
              for problem in problems:
                  print("::error::" + problem)
              sys.exit(1)
          print("patch H: the stack line (fed by the environment's own frame-pointer unwinder, the "
                "walk behind the panic backtrace) sits at the nil-component site after patch F's "
                "warning and patch G's origin line and before the path is built; the four defaults "
                "writes describe the value they store; every successful resource return of "
                "path_for_resource_helper is named; the panic backtrace is untouched; and patch G's "
                "module stays a pure logger that does not touch patch F's module")
          CHECK_FSSTACK

      - name: Build the shared SDL2 the core links against
        run: |
          set -eu
          echo "build-sdl-shared.sh started at $(date -u +%H:%M:%S) UTC"
          sh platform/ios/scripts/build-sdl-shared.sh iphoneos
          echo "build-sdl-shared.sh finished at $(date -u +%H:%M:%S) UTC"
          # sdl2-sys asks the linker for `-lSDL2` while CMake installs the
          # versioned name. CMake normally leaves the unversioned symlink in
          # place; create it if it is missing rather than fail much later.
          sdl_lib_dir="$PWD/build/sdl-shared-iphoneos/install/lib"
          if [ ! -e "$sdl_lib_dir/libSDL2.dylib" ] && [ -f "$sdl_lib_dir/libSDL2-2.0.0.dylib" ]; then
            ln -s libSDL2-2.0.0.dylib "$sdl_lib_dir/libSDL2.dylib"
            echo "Created $sdl_lib_dir/libSDL2.dylib -> libSDL2-2.0.0.dylib"
          fi
          ls -l "$sdl_lib_dir"

      - name: Build the core dylib (this is the long part)
        run: |
          set -eu
          echo "Core build started at $(date -u +%H:%M:%S) UTC"
          sh platform/ios/scripts/build-rust.sh aarch64-apple-ios Release
          echo "Core build finished at $(date -u +%H:%M:%S) UTC"

      - name: Verify the dylib
        run: |
          set -eu
          dylib=build/rust-ios-native/aarch64-apple-ios/release/libhyperhle_core.dylib

          echo "== the file exists and is not empty =="
          if [ ! -s "$dylib" ]; then
            echo "::error::$dylib is missing or empty"
            exit 1
          fi
          ls -l "$dylib"

          echo "== file(1): it is an arm64 Mach-O dylib =="
          file "$dylib"
          file "$dylib" | grep -q "Mach-O 64-bit" || { echo "::error::not a 64-bit Mach-O"; exit 1; }
          file "$dylib" | grep -q "arm64" || { echo "::error::not arm64"; exit 1; }

          echo "== vtool -show-build: platform IOS, minimum iOS 15.0 =="
          xcrun vtool -show-build "$dylib"
          platform=$(xcrun vtool -show-build "$dylib" | awk '/platform/ { print $2; exit }')
          if [ "$platform" != "IOS" ]; then
            echo "::error::built for platform $platform, not IOS"
            exit 1
          fi
          minos=$(xcrun vtool -show-build "$dylib" | awk '/minos/ { print $2; exit }')
          if [ "$minos" != "15.0" ]; then
            echo "::error::built for iOS $minos, not 15.0"
            exit 1
          fi

          echo "== LINKEDIT string pool is 8-byte aligned (dyld refuses otherwise) =="
          stroff=$(otool -l "$dylib" | awk '/LC_SYMTAB/ { found = 1 } found && $1 == "stroff" { print $2; exit }')
          if [ -z "$stroff" ]; then
            echo "::error::could not read stroff from LC_SYMTAB"
            exit 1
          fi
          echo "stroff=$stroff"
          if [ $((stroff % 8)) -ne 0 ]; then
            echo "::error::LINKEDIT string pool is mis-aligned (stroff=$stroff)"
            exit 1
          fi

          echo "== the API this build exists for is compiled in =="
          found=$(strings "$dylib" | grep -c "CFURLCreateDataAndPropertiesFromResource" || true)
          echo "CFURLCreateDataAndPropertiesFromResource occurrences: $found"
          if [ "$found" -lt 1 ]; then
            echo "::error::CFURLCreateDataAndPropertiesFromResource is not in the dylib"
            exit 1
          fi

          echo "== code signature check (informational) =="
          codesign -dv "$dylib" 2>&1 | head -5 || true

      - name: Collect the dylib and its sha256
        run: |
          set -eu
          dylib=build/rust-ios-native/aarch64-apple-ios/release/libhyperhle_core.dylib
          mkdir -p dist
          cp "$dylib" dist/libhyperhle_core.dylib
          shasum -a 256 dist/libhyperhle_core.dylib | tee dist/libhyperhle_core.dylib.sha256
          ls -l dist

      - name: Upload the dylib
        uses: actions/upload-artifact@v4
        with:
          name: hyperhle-core-ios-arm64-v9
          path: dist/*
          if-no-files-found: error
          retention-days: 30
