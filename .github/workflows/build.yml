                       "crate::fs_probe::note_open_failure_pc("):
              try:
                  if not open_body.index("let res = match env") < open_body.index(call) < open_body.rindex("    res\n"):
                      problems.append("src/libc/posix_io.rs: {} is not between the open and the return of `res`".format(call))
              except ValueError as error:
                  problems.append("src/libc/posix_io.rs: {}".format(error))
          if len(re.findall(r"(?m)^\s*res\s*=[^=]", open_body)) != 0:
              problems.append("src/libc/posix_io.rs: patch F introduced an assignment to `res`")

          # F3: Fs::write is still the same three-statement body, bound to a Result.
          write_body = fs[fs.index("pub fn write<P: AsRef<GuestPath>>(&mut self, path: P, data: &[u8]) -> Result<(), ()> {"):]
          write_body = write_body[:write_body.index("\n    }")]
          for line in ("        let mut options = GuestOpenOptions::new();",
                       "        options.write().create().truncate();",
                       "            .open_with_options(guest_path, options)",
                       "            .and_then(|mut file| file.write_all(data).map_err(|_| ()));"):
              if line not in write_body:
                  problems.append("src/fs.rs: the pre-patch write body line {!r} is missing".format(line))
          if "options)?" in write_body:
              problems.append("src/fs.rs: Fs::write still returns early on open failure, so the failure is untraced")
          if not write_body.rstrip().endswith("result"):
              problems.append("src/fs.rs: Fs::write no longer returns the traced Result")

          # F4: each probe hook reports the very value the method returns, next to it.
          if "let exists = env.fs.exists(GuestPath::new(&path));\n    crate::fs_probe::note_exists(&path, exists, None);\n    exists\n}" not in fm:
              problems.append("ns_file_manager.rs: fileExistsAtPath: does not return the value it traces")
          if "let exists = env.fs.exists(GuestPath::new(&path)); // All existing files are writable\n    // Patch F (v7): the writable half of the pair, and the one that matters for\n    // the \"the app cannot write its save/marker file\" hypothesis.\n    crate::fs_probe::note_access(&path, true, exists);\n    exists\n}" not in fm:
              problems.append("ns_file_manager.rs: isWritableFileAtPath: does not return the value it traces")
          # The isDirectory flag is computed before it is written and traced, so the trace
          # reports what the caller was told.
          is_dir_at = fm.index("let is_dir = env.fs.is_dir(guest_path);\n        if !is_dir_ptr.is_null() {")
          write_at = fm.index("env.mem.write(is_dir_ptr, is_dir);", is_dir_at)
          trace_at = fm.index("crate::fs_probe::note_exists(&path_str, true, Some(is_dir));", write_at)
          if not is_dir_at < write_at < trace_at:
              problems.append("ns_file_manager.rs: the isDirectory trace does not follow the value it reports")

          # F5: the warning is inside stringByAppendingPathComponent: and ahead of the call
          # that actually drops the empty component.
          append_impl = nsstr[nsstr.index("- (id)stringByAppendingPathComponent:(id)component {"):]
          append_impl = append_impl[:append_impl.index("\n}")]
          for needed in ("let component_str = to_rust_string(env, component);",
                         "if component.is_null() || component_str.is_empty() {",
                         "crate::fs_probe::note_path_component(&base_str, component.is_null());"):
              if needed not in append_impl:
                  problems.append("ns_string.rs: {!r} is not in stringByAppendingPathComponent:".format(needed))
          if not append_impl.index("note_path_component") < append_impl.index("let res = path_algorithms::string_by_appending_path_component"):
              problems.append("ns_string.rs: the path-join warning comes after the path is already built")

          # F6: the frame tick is inside presentRenderbuffer and E7's tick is untouched.
          present = eagl[eagl.index("- (bool)presentRenderbuffer:(NSUInteger)target {"):]
          present = present[:present.index("\n    assert!(target == gles11::RENDERBUFFER_OES);")]
          for needed in ("static FRAME_COUNTER: AtomicU64", "if n % 600 == 0 {",
                         "crate::fs_trace::print_summary(n);", "crate::fs_probe::note_frame(n);"):
              if needed not in present:
                  problems.append("eagl.rs: {!r} is not in presentRenderbuffer".format(needed))
          if not present.index("crate::fs_trace::print_summary(n);") < present.index("crate::fs_probe::note_frame(n);"):
              problems.append("eagl.rs: patch F's frame tick is not beside patch E's summary")
          # The cadence the module documents is 60 then every 300; multiples of 600 are
          # left to E7's tick. Both halves must be present in the module.
          for needed in ("if frame == FIRST_SUMMARY_FRAME || frame % SUMMARY_PERIOD == 0 {",
                         "if frame % E7_SUMMARY_PERIOD != 0 {",
                         "crate::fs_trace::print_summary(frame);"):
              if needed not in probe:
                  problems.append("src/fs_probe.rs: the summary cadence is missing {!r}".format(needed))

          # F7: the final summary sits on both exit paths, after the log line of each.
          main_exit = env_rs.index("Main thread exited normally")
          if env_rs.index("crate::fs_probe::print_final_summary();", main_exit) - main_exit > 400:
              problems.append("src/environment.rs: no final summary near the main-thread exit")
          host_exit = env_rs.index("Returning to the iOS host library.")
          if env_rs.index("crate::fs_probe::print_final_summary();", host_exit) - host_exit > 400:
              problems.append("src/environment.rs: no final summary near the host stop path")

          for name in ("src/lib.rs", "src/libc/posix_io.rs", "src/fs.rs",
                       "src/frameworks/foundation/ns_file_manager.rs",
                       "src/frameworks/foundation/ns_string.rs",
                       "src/frameworks/opengles/eagl.rs", "src/environment.rs",
                       "src/fs_probe.rs"):
              content = pathlib.Path(name).read_text(encoding="utf-8")
              if content.count("{") != content.count("}"):
                  problems.append("{}: braces are unbalanced".format(name))

          if problems:
              for problem in problems:
                  print("::error::" + problem)
              sys.exit(1)
          print("patch F: the probe/write trace module, all nine NSFileManager probe hooks, "
                "the path-join warning, the write-intent open hook, the whole-file write hook, "
                "the failed-open PC hook, the 60/300-frame summary cadence and the final "
                "summary on both exit paths are in place, and every patch F call site can only "
                "observe, never change, the emulated result")
          CHECK_FSPROBE

      - name: Build the shared SDL2 the core links against
        run: |
          set -eu
          echo "build-sdl-shared.sh started at $(date -u +%H:%M:%S) UTC"
          sh platform/ios/scripts/build-sdl-shared.sh iphoneos
          echo "build-sdl-shared.sh finished at $(date -u +%H:%M:%S) UTC"
          # sdl2-sys asks the linker for `-lSDL2` while CMake installs the
          # versioned name. CMake normally leaves the unversioned symlink in
          # place; create it if it is missing rather than fail much later.
          sdl_lib_dir="$PWD/build/sdl-shared-iphoneos/install/lib"
          if [ ! -e "$sdl_lib_dir/libSDL2.dylib" ] && [ -f "$sdl_lib_dir/libSDL2-2.0.0.dylib" ]; then
            ln -s libSDL2-2.0.0.dylib "$sdl_lib_dir/libSDL2.dylib"
            echo "Created $sdl_lib_dir/libSDL2.dylib -> libSDL2-2.0.0.dylib"
          fi
          ls -l "$sdl_lib_dir"

      - name: Build the core dylib (this is the long part)
        run: |
          set -eu
          echo "Core build started at $(date -u +%H:%M:%S) UTC"
          sh platform/ios/scripts/build-rust.sh aarch64-apple-ios Release
          echo "Core build finished at $(date -u +%H:%M:%S) UTC"

      - name: Verify the dylib
        run: |
          set -eu
          dylib=build/rust-ios-native/aarch64-apple-ios/release/libhyperhle_core.dylib

          echo "== the file exists and is not empty =="
          if [ ! -s "$dylib" ]; then
            echo "::error::$dylib is missing or empty"
            exit 1
          fi
          ls -l "$dylib"

          echo "== file(1): it is an arm64 Mach-O dylib =="
          file "$dylib"
          file "$dylib" | grep -q "Mach-O 64-bit" || { echo "::error::not a 64-bit Mach-O"; exit 1; }
          file "$dylib" | grep -q "arm64" || { echo "::error::not arm64"; exit 1; }

          echo "== vtool -show-build: platform IOS, minimum iOS 15.0 =="
          xcrun vtool -show-build "$dylib"
          platform=$(xcrun vtool -show-build "$dylib" | awk '/platform/ { print $2; exit }')
          if [ "$platform" != "IOS" ]; then
            echo "::error::built for platform $platform, not IOS"
            exit 1
          fi
          minos=$(xcrun vtool -show-build "$dylib" | awk '/minos/ { print $2; exit }')
          if [ "$minos" != "15.0" ]; then
            echo "::error::built for iOS $minos, not 15.0"
            exit 1
          fi

          echo "== LINKEDIT string pool is 8-byte aligned (dyld refuses otherwise) =="
          stroff=$(otool -l "$dylib" | awk '/LC_SYMTAB/ { found = 1 } found && $1 == "stroff" { print $2; exit }')
          if [ -z "$stroff" ]; then
            echo "::error::could not read stroff from LC_SYMTAB"
            exit 1
          fi
          echo "stroff=$stroff"
          if [ $((stroff % 8)) -ne 0 ]; then
            echo "::error::LINKEDIT string pool is mis-aligned (stroff=$stroff)"
            exit 1
          fi

          echo "== the API this build exists for is compiled in =="
          found=$(strings "$dylib" | grep -c "CFURLCreateDataAndPropertiesFromResource" || true)
          echo "CFURLCreateDataAndPropertiesFromResource occurrences: $found"
          if [ "$found" -lt 1 ]; then
            echo "::error::CFURLCreateDataAndPropertiesFromResource is not in the dylib"
            exit 1
          fi

          echo "== code signature check (informational) =="
          codesign -dv "$dylib" 2>&1 | head -5 || true

      - name: Collect the dylib and its sha256
        run: |
          set -eu
          dylib=build/rust-ios-native/aarch64-apple-ios/release/libhyperhle_core.dylib
          mkdir -p dist
          cp "$dylib" dist/libhyperhle_core.dylib
          shasum -a 256 dist/libhyperhle_core.dylib | tee dist/libhyperhle_core.dylib.sha256
          ls -l dist

      - name: Upload the dylib
        uses: actions/upload-artifact@v4
        with:
          name: hyperhle-core-ios-arm64-v7
          path: dist/*
          if-no-files-found: error
          retention-days: 30
