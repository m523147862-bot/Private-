          problems = []

          origin = pathlib.Path("src/fs_origin.rs").read_text(encoding="utf-8")
          nsstr = pathlib.Path("src/frameworks/foundation/ns_string.rs").read_text(encoding="utf-8")
          nsdata = pathlib.Path("src/frameworks/foundation/ns_data.rs").read_text(encoding="utf-8")
          defaults = pathlib.Path("src/frameworks/foundation/ns_user_defaults.rs").read_text(encoding="utf-8")
          fs = pathlib.Path("src/fs.rs").read_text(encoding="utf-8")
          lib_rs = pathlib.Path("src/lib.rs").read_text(encoding="utf-8")

          # G1: the origin module must be a pure logger, and it must not reach into patch
          # F's module.
          for bad in ("unsafe", "unwrap(", "expect(", "panic!", "todo!", "unimplemented!",
                      "std::process::", "std::fs::", "Environment", "env.", "fs_probe"):
              if bad in origin:
                  problems.append("src/fs_origin.rs: contains {!r}, which instrumentation must not use".format(bad))

