          /// `stringByAppendingPathComponent:`. The first [STACK_TRACES_MAX] occurrences
          /// print; after that only the two lines patch F and patch G already print
          /// appear, so the log cannot flood.
          pub fn note_path_component_stack(base: &str, component_is_nil: bool, frames: &[u32]) {
              let printed = STACK_TRACES.fetch_add(1, Ordering::Relaxed);
              if printed >= STACK_TRACES_MAX {
                  return;
              }
              log!(
                  "PATHJOIN STACK base={:?} component=<{}>",
                  base,
                  if component_is_nil { "nil" } else { "empty" }
              );
              let mut line = String::new();
              for (index, address) in frames.iter().enumerate() {
                  if index != 0 {
                      line.push(' ');
                  }
                  let _ = std::fmt::write(&mut line, format_args!("#{} {:#010x}", index, address));
              }
              log!("{}", line);
