          def fail(message):
              print("ERROR: " + message, file=sys.stderr)
              raise SystemExit(1)


          def balance(text):
              return text.count("{") == text.count("}")


          def main():
              repo = Path(sys.argv[1] if len(sys.argv) > 1 else ".")

              targets = sorted({edit[1] for edit in EDITS} | {FS_PROBE})
              texts = {}
              for target in targets:
                  path = repo / target
                  if path.is_file():
                      texts[target] = path.read_text(encoding="utf-8").replace("\r\n", "\n")
                  elif target == FS_PROBE:
                      texts[target] = None
                  else:
                      fail("{} does not exist".format(path))

              # F1: the new module. Unlike the other files it is created rather than
              # edited, so idempotency is "is it already there?" plus "is the existing
              # copy one the patch can recognise?".
              if texts[FS_PROBE] is None:
                  if not balance(FS_PROBE_RS):
                      fail("the probe module the script carries is brace-unbalanced")
                  texts[FS_PROBE] = FS_PROBE_RS
                  print("created: F1 {} ({} bytes)".format(FS_PROBE, len(FS_PROBE_RS)))
              elif "pub fn note_exists(path: &str, exists: bool, is_dir: Option<bool>)" in texts[FS_PROBE]:
                  print("already applied: F1 {} (leaving the existing copy alone)".format(FS_PROBE))
              else:
                  fail("{} already exists but does not look like the probe module; refusing to overwrite".format(FS_PROBE))

              for name, target, old, new, occurrences, markers in EDITS:
                  text = texts[target]
                  if all(marker in text for marker in markers):
                      print("already applied: {} ({})".format(name, target))
                      continue
                  found = text.count(old)
                  if found != occurrences:
                      fail(
                          "{}: expected {} occurrence(s) of the anchor text for \"{}\", found {}".format(
                              target, occurrences, name, found
                          )
                      )
                  replaced = text.replace(old, new)
                  if replaced == text:
                      fail("{}: \"{}\" did not change the file".format(target, name))
                  if replaced.count("{") - text.count("{") != replaced.count("}") - text.count("}"):
                      fail("{}: \"{}\" changed the brace balance".format(target, name))
                  for marker in markers:
                      if replaced.count(marker) != occurrences:
                          fail("{}: \"{}\" landed {} time(s) for marker {!r}, expected {}".format(
                              target, name, replaced.count(marker), marker, occurrences))
                  texts[target] = replaced
                  print("applied: {} ({})".format(name, target))

              for name, target, _old, _new, occurrences, markers in EDITS:
                  for marker in markers:
                      if texts[target].count(marker) != occurrences:
                          fail("{}: post-condition failed for \"{}\": {} occurrence(s) of {!r}, expected {}".format(
                              target, name, texts[target].count(marker), marker, occurrences))

              for target, text in texts.items():
                  if not balance(text):
                      fail("{}: braces are unbalanced at the end ({} '{{' vs {} '}}')".format(
                          target, text.count("{"), text.count("}")))
                  path = repo / target
                  path.parent.mkdir(parents=True, exist_ok=True)
                  with open(path, "w", encoding="utf-8", newline="\n") as output_file:
                      output_file.write(text)
                  print("wrote {}".format(path))

              # Patch F must not have changed a single line patches A-E inserted. The
              # cheapest proof is the markers the v7 self-check asserts; the two most
              # load-bearing ones are re-checked here (patch E's own summary tick and its
              # open hook), together with the two patch F lines that share their site.
              posix = texts[POSIX_IO]
              for name, marker, expected in (
                  ("E2 open hook", "crate::fs_trace::note_open(&actual_path_string, res != -1, flags);", 1),
                  ("F2 failed-open PC", "crate::fs_probe::note_open_failure_pc(", 1),
                  ("F2 write-intent open", "crate::fs_probe::note_write_open(&actual_path_string, flags, res != -1);", 1),
              ):
                  if posix.count(marker) != expected:
                      fail("{}: {} appears {} time(s), expected {}".format(
                          POSIX_IO, name, posix.count(marker), expected))
              eagl = texts[EAGL]
              for name, marker, expected in (
                  ("E7 summary tick", "if n % 600 == 0 {", 1),
                  ("E7 summary call", "crate::fs_trace::print_summary(n);", 1),
                  ("F6 frame tick", "crate::fs_probe::note_frame(n);", 1),
              ):
                  if eagl.count(marker) != expected:
                      fail("{}: {} appears {} time(s), expected {}".format(
                          EAGL, name, eagl.count(marker), expected))
              if texts[ENVIRONMENT].count("crate::fs_probe::print_final_summary();") != 2:
                  fail("{}: the final summary is not on both exit paths".format(ENVIRONMENT))
              print("post-check: patch E's summary tick and open hook are untouched, the two "
                    "write/open traces and the frame tick are in place, and the final summary "
                    "sits on both exit paths")


