          /// Patch H (v9): an `NSUserDefaults` write, the write side of patch G's
          /// [note_defaults_query].
          ///
          /// `selector` is the writing method, `key` the defaults key and `summary` a
          /// one-token description of the value being stored (`str(len=N)`, a class name,
          /// or `removed` for `removeObjectForKey:`). Patch G traced the lookups but not
          /// the stores, so the log could not show what the app had already written when
          /// a later `stringForKey:` answered nil. Rate limit: per `(key, value)` pair,
          /// the same policy as the lookups (see [DEFAULTS_HEAD] and [DEFAULTS_SAMPLE]),
          /// plus the shared global backstop.
          pub fn note_defaults_write(selector: &str, key: &str, summary: &str) {
