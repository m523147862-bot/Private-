          /// `-[NSFileManager contentsOfDirectoryAtPath:error:]` forwards to.
          ///
          /// `count` is `None` when the directory could not be listed at all, i.e. the
          /// path does not exist or is not a directory. The count is the point of this
          /// line: "the bundle directory lists as empty" and "the directory lists fine
          /// but nothing in it is opened" are different bugs.
          pub fn note_directory(path: &str, count: Option<usize>) {
