      - name: Check that the patches really landed, including the touch mapping, the
             CJK/Arabic text fallback and the CJK/Arabic glyph-id pipeline
        run: |
          set -eu
          set -o pipefail
          # The embedded scripts below ship gzip-compressed and base64-encoded: as plain
          # text they pushed this file past the size GitHub accepts for a workflow file.
          # gunzip_b64 expands one back to stdout. macOS base64 (BSD) spells decoding -D
          # where GNU coreutils spells it -d, so probe for the one this machine has.
          gunzip_b64() {
            if [ "$(printf 'aGk=' | base64 -d 2>/dev/null || true)" = "hi" ]; then
              base64 -d | gunzip
            else
              base64 -D | gunzip
            fi
          }
          # Self-check for the CoreFoundation patch (A), the logging patches (B), the
          # bundle-root resource fallback (C, v4), the EUC-KR decoding patch (D, v5), the
          # file-access / texture-upload tracing (E, v6), the filesystem probe / write
          # tracing (F, v7), the path-origin tracing (G, v8), the nil-component stack
          # trace (H, v9), the `__vsprintf_chk` signature fix (I, v10), the guest-
          # filesystem resource read (K, v12), the shared touch/render geometry (v13), the
          # CJK/Arabic text fallback (L, v14) and the CJK/Arabic glyph-id pipeline (M, v16).
          # Run from the root of the checkout. Fails the build if any of them did not land,
          # so a run can never upload a dylib that still logs the old way, still hides the
          # lookup's directory/lproj, is still missing the resource-lookup fix, still
          # sends the app's EUC-KR text through the UTF-8 default, still prints only the
          # first texture upload of a run, still cannot show the probe and write calls
          # that explain a path which is opened over and over but is never a file, still
          # cannot say which guest call produced the nil path component that turned that
          # path into a directory, or still reports only the single PC/return-address pair
          # that the v8 device log proved is not a caller, or still left the buffer of a
          # `_FORTIFY_SOURCE` printf all-zero because `__vsprintf_chk` read the wrong
          # argument, or still read the bytes that
          # CFURLCreateDataAndPropertiesFromResource returns through the host filesystem
          # instead of the emulated one, or still lays out and rasterises a CJK or Arabic
          # string with a Latin-only face on the CoreText paths, or still maps host touches
          # through its own copy of the letterbox rectangle instead of the one shared in
          # src/window/geometry.rs, or still maps a CJK/Arabic character to `.notdef` and
          # draws that id with a font that never produced it.
          
          core=src/frameworks/core_foundation/cf_url.rs
          definitions=$(grep -c "fn CFURLCreateDataAndPropertiesFromResource(" "$core" || true)
          exports=$(grep -c "export_c_func!(CFURLCreateDataAndPropertiesFromResource" "$core" || true)
          echo "patch A: definitions=$definitions exports=$exports"
          if [ "$definitions" != "1" ] || [ "$exports" != "1" ]; then
            echo "::error::patch A did not apply cleanly (definitions=$definitions, exports=$exports)"
            exit 1
          fi
          
          # Every marker below is a string whose occurrence count in the patched file the
          # corresponding patch script fixes: the ones an edit inserts must appear the
          # stated number of times, and any marker with expected 0 asserts that a form the
          # patch is supposed to have replaced is really gone. The counts are compared, so
          # a marker that appears even once too often fails the build.
          check_marker() {
            target=$1
            marker=$2
            expected=$3
            count=$(grep -c -F -- "$marker" "$target" || true)
            echo "  $target: '$marker' x$count (expected $expected)"
            if [ "$count" != "$expected" ]; then
              echo "::error::$target: '$marker' appears $count time(s), expected $expected"
              exit 1
            fi
          }
          
          bundle=src/frameworks/foundation/ns_bundle.rs
          check_marker "$bundle" "let path_debug = ns_string::to_rust_string(env, path);" 1
          check_marker "$bundle" "let data_path_debug = ns_string::to_rust_string(env, data_path);" 1
          check_marker "$bundle" "let name_debug = ns_string::to_rust_string(env, name);" 1
          check_marker "$bundle" "let extension_debug = ns_string::to_rust_string(env, extension);" 1
          # Patch C v4 (C2): the missing-resource log names the lookup's directory and
          # lproj, and both are converted with the nil-safe helper.
          check_marker "$bundle" "let directory_debug = ns_string::to_rust_string(env, directory);" 1
          check_marker "$bundle" "let lproj_debug = ns_string::to_rust_string(env, lproj);" 1
          check_marker "$bundle" "(name={:?} extension={:?} directory={:?} lproj={:?})" 1
          
          # Patch C v4 (C1): one bundle-root retry in each pathForResource:ofType:inDirectory:
          # implementation (the + class method and the - instance method), so exactly two,
          # and both must pass nil for *both* lproj and directory - only that reaches the
          # bundle root. The positive marker carries the `let bundle_root_path =` prefix.
          check_marker "$bundle" "let bundle_root_path = path_for_resource_helper(env, this, name, nil, nil, extension);" 2
          # Negative assertion: the v3 form of the same retry dropped only lproj and kept
          # passing the caller's `directory`, which recomputed the path the function had
          # already tried and therefore never reached the bundle root. It must be gone.
          # The `let bundle_root_path =` prefix keeps this marker on the fallback call
          # alone: the two pre-existing calls at the top of both implementations are
          # `let path = path_for_resource_helper(env, this, name, nil, directory,
          # extension);` and do not match it.
          check_marker "$bundle" "let bundle_root_path = path_for_resource_helper(env, this, name, nil, directory, extension);" 0
          
          posix=src/libc/posix_io.rs
          check_marker "$posix" "let read_fd_path: Option<String> = file.path.clone();" 1
          check_marker "$posix" "let lseek_fd_path: Option<String> = file.path.clone();" 1
          check_marker "$posix" "called on a guest directory" 2
          check_marker "$posix" "returning {} (guest path: {:?})" 1
          check_marker "$posix" "returning -1 (guest path: {:?})" 1
          
          fs=src/fs.rs
          check_marker "$fs" "no path or fd at this layer" 1
          
          echo "== the pre-patch log calls must be gone =="
          # CHECK_OLD_LOGS: 1594 bytes, sha256 deefe4cf72ec11fb6becb2a9fb1bfa673c3cbcf50720a1e654164bbf07697986
          gunzip_b64 <<'CHECK_OLD_LOGS_GZ' | python3 -
          H4sIAAAAAAAC/61US2/bMAy++1ew7iE2ljrbbfAQDCh22WUY0A07dEWg2HQjRJYMUV6TBf7vo+RH
          kDq9TYAfokiK38eHrBtjHTTC7ZTcRrLf0pGi6BZ+7BDwIAoHDg9BqdjBPVhslCiwzOBrBUIfwVQg
          HUgCclIpcDu06N+DRSlLdqaNAyV0CeEB22p4Ma0qoW2UEV5UmGAmWM88U3BAokZoCRUSQWOkdmgp
          i8gJhbCGUwS8YrLFqrKs+mLsnlaVaXUpnDR6pWmz5Y3CzFKcw2PQ92uxWPgPX3STTML428N90GaI
          ZFpbICuYfdvkcMo/d1BLIqmfl/BTS3eEL8IJqIRSW1Hsew08SHK0PnXxcvLquT3vODCxeUO06c3D
          Qfop4hh7paflGSdnqVg1huRhI81rVHaANa5LeBPMX8JqxpEzTFEmPvAljO/bQ5cC6oI5ZK6xBLTW
          2OH498wXu3Bt8AYXoMdVlXPZtq0qtHM5yb84l14RcXYuZG9xVdEbaZ9xdKbkAXHv0QguW4uFM/YI
          gnj73CI5qKTCm/jVhV0UNdZsFdbERfn4FFXMmOZ6XIbGIZAaQslm0rFOkubBsjBMsXZsMrRf9p2/
          iTdMM5+ajbdOfDJKDmkdt666+xinwdhfEbqSfYdL8gmkrKaT4Yr8gq4x1kw0DeoyiU9dPrSu1xdS
          983XWLzrO5g5goILHSpralBSYyiIOOMoauHmJXYGn5GzsknSjBolnTdl/I/vn9I0mmia+PkPvDD4
          wT4LNczo4hRu1q+lXZyeWbnKyNbykOPM81Bq9Vbw7OKZB8mpg8XptIA/BP636xbpdR56DubBLK+E
          4tngyMc48inFg8QzdHnYhy29fZ6HHs3zGN6NWj0ZPMczniku+ZBGg7I21/JqsQ5p97N5GtyM1pd7
          T0Fg426kIU6jf9G1Rvs6BgAA
          CHECK_OLD_LOGS_GZ
          
          echo "== patch D (v5): EUC-KR =="
          # Patch D gives the emulator the Korean text encoding the app asks for. Each
          # marker below is a code line patch D inserts, with the count the patch script
          # guarantees, so a missing or a duplicated insertion fails the build. The plain
          # `| kCFStringEncodingEUC_KR` marker is expected twice: it is a prefix of the
          # `_HighBit` whitelist line as well as the name of the plain one.
          cfstring=src/frameworks/core_foundation/cf_string.rs
          nsstring=src/frameworks/foundation/ns_string.rs
          check_marker "$cfstring" "pub const kCFStringEncodingEUC_KR: CFStringEncoding = 0x940;" 1
          check_marker "$cfstring" "pub const kCFStringEncodingEUC_KR_HighBit: CFStringEncoding = 0x80000940;" 1
