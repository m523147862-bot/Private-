                      &base_str,
                      component.is_null(),
                      env.cpu.pc_with_thumb_bit().addr_with_thumb_bit(),
                      env.cpu.regs()[crate::cpu::Cpu::LR],
                  );
                  // Patch H (v9): the guest call stack at this exact drop. Patch G's
                  // `pc`/`ret` pair was the same address on every v8 device occurrence
                  // and is not a caller, so the frames come from touchHLE's own
                  // frame-pointer unwinder (`Environment::guest_stack_frames`, the walk
                  // behind the "Attempting to produce stack trace" output). Three traces
                  // print, then only patch F's warning and patch G's line. Log only: no
