                  continue
              if lookup not in body:
                  problems.append("src/frameworks/foundation/ns_user_defaults.rs: the {} lookup changed shape".format(selector))
              elif body.index(lookup) > body.index(call):
                  problems.append("src/frameworks/foundation/ns_user_defaults.rs: the {} trace precedes its lookup".format(selector))
              if "if val == nil" in body and body.index("if val == nil") < body.index(call):
                  problems.append("src/frameworks/foundation/ns_user_defaults.rs: the {} trace follows the nil check, so a "
                                  "missing key would be invisible".format(selector))
              if "let key_str = defaults_key_string(env, key);" not in body:
