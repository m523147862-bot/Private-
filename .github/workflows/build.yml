          use std::collections::HashMap;
          use std::sync::atomic::{AtomicBool, AtomicU32, AtomicU64, Ordering};
          use std::sync::{Mutex, OnceLock};

          /// The first this many calls of one outcome on one path print in full.
          ///
          /// Four is enough to see the "same path, again and again, never a file"
          /// pattern the v6 log shows for `<App>/Documents` without printing the same line
          /// 600 times in a 600-frame run.
          const HEAD_SUCCESS: u32 = 4;
          /// Failures are the interesting case, so more of them print in full.
          const HEAD_FAILURE: u32 = 16;
          /// After the head, one call in this many prints a line, per path and outcome.
          const SAMPLE_SUCCESS: u32 = 200;
          const SAMPLE_FAILURE: u32 = 25;

          /// Backstop for the case the per-path budget cannot bound: an app probing a
          /// huge number of *different* paths. After this many probe lines (all kinds
          /// together) only one event in [GLOBAL_SAMPLE] prints.
          const GLOBAL_BUDGET: u32 = 4000;
          const GLOBAL_SAMPLE: u32 = 100;
          /// Number of distinct paths the per-path table remembers. Entries are keyed by
          /// a hash, so the table never keeps a copy of a path and stays small.
          const MAX_TRACKED_PATHS: usize = 4096;

          /// The earliest useful snapshot.
          const FIRST_SUMMARY_FRAME: u64 = 60;
          /// Then one snapshot every this many frames.
          const SUMMARY_PERIOD: u64 = 300;
          /// Patch E's own `-[EAGLContext presentRenderbuffer:]` tick prints the shared
          /// `FS SUMMARY` line on multiples of this many frames. Patch F must not edit
          /// that line, so at those frames it only adds its own line: the union of the
          /// two ticks is 60, 300, 600, 900, ... and no frame prints a summary twice.
          const E7_SUMMARY_PERIOD: u64 = 600;

          /// Probe lines printed so far (all kinds), for the global backstop.
          static PROBE_LINES: AtomicU32 = AtomicU32::new(0);

          // Cumulative counters, reported by `print_probe_summary`. They are updated
          // whether or not a line was printed, so the totals stay exact.
          static EXISTS_OK: AtomicU32 = AtomicU32::new(0);
          static EXISTS_ERR: AtomicU32 = AtomicU32::new(0);
          static LIST_OK: AtomicU32 = AtomicU32::new(0);
          static LIST_ERR: AtomicU32 = AtomicU32::new(0);
          static ATTRS_OK: AtomicU32 = AtomicU32::new(0);
          static ATTRS_ERR: AtomicU32 = AtomicU32::new(0);
          static READABLE_ERR: AtomicU32 = AtomicU32::new(0);
          static WRITABLE_ERR: AtomicU32 = AtomicU32::new(0);
          static PATHJOIN_EMPTY: AtomicU32 = AtomicU32::new(0);
          static WRITE_OPENS_OK: AtomicU32 = AtomicU32::new(0);
          static WRITE_OPENS_ERR: AtomicU32 = AtomicU32::new(0);
          static WRITE_FILES_OK: AtomicU32 = AtomicU32::new(0);
          static WRITE_FILES_ERR: AtomicU32 = AtomicU32::new(0);

          /// Last frame seen by [note_frame], for [print_final_summary].
          static LAST_FRAME: AtomicU64 = AtomicU64::new(0);
          /// Guards [print_final_summary] so the final lines print at most once.
          static FINAL_PRINTED: AtomicBool = AtomicBool::new(false);

          /// Per-path call counts, split by outcome.
          #[derive(Default)]
          struct PathCounts {
              ok: u32,
              err: u32,
          }

          fn path_table() -> &'static Mutex<HashMap<u64, PathCounts>> {
              static TABLE: OnceLock<Mutex<HashMap<u64, PathCounts>>> = OnceLock::new();
              TABLE.get_or_init(|| Mutex::new(HashMap::new()))
          }

          /// FNV-1a hash of a path.
          ///
          /// A probe site can run every frame, so the table keys on a hash instead of on
          /// the path itself: no allocation per event and a bounded table entry.
          fn path_hash(path: &str) -> u64 {
              let mut hash: u64 = 0xcbf2_9ce4_8422_2325;
              for byte in path.as_bytes() {
                  hash ^= *byte as u64;
                  hash = hash.wrapping_mul(0x0000_0100_0000_01b3);
              }
              hash
          }

          fn within_head(count: u32, head: u32, sample: u32) -> bool {
              count < head || count % sample == 0
          }

          /// Decides whether one probe/write event should print a line.
          fn should_print(path: &str, failed: bool) -> bool {
              let global = PROBE_LINES.fetch_add(1, Ordering::Relaxed);
              if global >= GLOBAL_BUDGET && global % GLOBAL_SAMPLE != 0 {
                  return false;
              }
              let Ok(mut table) = path_table().lock() else {
                  // The lock can only be poisoned by a panic while it is held, which
                  // cannot happen here (the critical section only touches the map). If it
                  // ever is, fall back to the global backstop alone.
                  return true;
              };
              let key = path_hash(path);
              if table.len() >= MAX_TRACKED_PATHS && !table.contains_key(&key) {
                  // Out of room: this path keeps no per-path budget of its own and is
                  // governed by the global backstop above.
                  return true;
              }
              let counts = table.entry(key).or_default();
              if failed {
                  let seen = counts.err;
                  counts.err = seen.saturating_add(1);
                  within_head(seen, HEAD_FAILURE, SAMPLE_FAILURE)
              } else {
                  let seen = counts.ok;
                  counts.ok = seen.saturating_add(1);
                  within_head(seen, HEAD_SUCCESS, SAMPLE_SUCCESS)
              }
          }

          /// `-[NSFileManager fileExistsAtPath:]` and
          /// `-[NSFileManager fileExistsAtPath:isDirectory:]`.
          ///
          /// `is_dir` is `Some` only for the variant that also asks whether the item is
          /// a directory.
          pub fn note_exists(path: &str, exists: bool, is_dir: Option<bool>) {
              if exists {
                  EXISTS_OK.fetch_add(1, Ordering::Relaxed);
              } else {
                  EXISTS_ERR.fetch_add(1, Ordering::Relaxed);
              }
              if !should_print(path, !exists) {
                  return;
              }
              match (exists, is_dir) {
                  (true, Some(true)) => log!("FSEXIST {} ok=1 isdir=1", path),
                  (true, Some(false)) => log!("FSEXIST {} ok=1 isdir=0", path),
                  (true, None) => log!("FSEXIST {} ok=1", path),
                  (false, _) => log!("FSEXIST {} ok=0", path),
              }
          }

