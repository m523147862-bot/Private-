              (FS_ORIGIN, "pub fn note_path_component_stack(base: &str, component_is_nil: bool, frames: &[u32])", 1),
              (FS_ORIGIN, "pub fn note_defaults_write(selector: &str, key: &str, summary: &str)", 1),
              (FS_ORIGIN, "pub fn note_path_found(path: &str)", 1),
              (FS_ORIGIN, "PATHJOIN STACK base={:?} component=<{}>", 1),
              (FS_ORIGIN, "NSDEFAULTSSET {} key={:?} <- {}", 1),
              (FS_ORIGIN, "PATHFOUND {}", 1),
              (NS_STRING, "crate::fs_origin::note_path_component_stack(", 1),
              (NS_STRING, "&env.guest_stack_frames(12),", 1),
