#
# Builds the iOS emulator core (libhyperhle_core.dylib) for Applesauce on a
# GitHub-hosted macOS machine, so the core can be built without owning a Mac.
#
# How to use it: put this file in a repository as .github/workflows/build.yml,
# then open the Actions tab, pick "Build iOS emulator core (dylib)" and press
# "Run workflow". A run takes about 20-40 minutes; the finished dylib is in the
# Artifacts section at the bottom of the run page.
#
# Nothing needs to be forked. The job checks out the upstream Applesauce
# repository at a fixed commit on the runner itself, applies ten patches,
# builds the core, verifies the result and uploads it. This file is the only
# file the account running it needs.
#
# This is the v12 variant of build-core.yml (v1). v2 added the logging; v3 added
# the first patch that fixes a bug instead of instrumenting one; v4 corrected
# that patch and added two fields to the log it was hidden behind; v5 makes the
# emulator decode EUC-KR, the encoding the app asks for; v6 added the
# file-access and texture-upload tracing; v7 added the tracing of the filesystem
# calls that never open a file, because the v6 device log showed a path that is
# opened 30 times and is never a file; v8 adds the tracing of where that nil
# path component comes from, because the v7 device log showed the mechanism but
# not the culprit; v9 adds the guest call stack at the point that nil is produced,
# because the v8 log showed the single PC/return-address pair patch G recorded was
# not a caller but a state-machine instruction and two data-table addresses; v10
# fixes the `__vsprintf_chk` argument order, because disassembling the caller that
# produced the empty path component showed it fills that name with a
# `_FORTIFY_SOURCE` call whose buffer the emulator was leaving all-zero; v12
# fixes that same resource path, because the v10 device log showed patch A's own
# reader asking the host filesystem for a guest path and failing 39 times out of
# 39:
#   patch A (identical to v1) adds the missing CoreFoundation entry point
#     CFURLCreateDataAndPropertiesFromResource, the reason games showed a black
#     screen;
#   patch B is instrumentation only, it changes no behaviour, no return value
#     and no control flow: it makes the warnings about a missing bundle resource
#     and about reading/seeking a directory print the real guest paths instead
#     of ObjC pointers, so "Fail to Create data" can be traced to the exact file
#     the app was looking for. The only lines it touches are log! arguments;
#   patch C fixes the bundle-resource lookup. On a device the core reported 38
#     .png files as missing that all really exist in the app bundle root
#     (nexon-co.png, back.png, ...), because touchHLE only ever tried localized
#     .lproj paths. v3's retry dropped the lproj but still passed the caller's
#     directory (the log shows it was "English.lproj"), so it recomputed a path
#     the function had already tried and nothing changed. v4 passes nil for both
#     lproj and directory, the only combination that reaches the plain
#     <bundle>/<name> path, and logs the directory and lproj of every failed
#     lookup so the two components can no longer be confused.
#   patch D (v5) teaches the core the one encoding the app under test keeps
#     asking for and touchHLE did not implement: EUC-KR. A v4 run printed
#     14,420 "Unhandled CFStringEncoding 0x940" warnings (9,349 of them in a
#     row, and nothing else) while the game sat at 26% of its loading bar.
#     0x940 is kCFStringEncodingEUC_KR, so the app's Korean text tables fell
#     through to the UTF-8 default, the game read mojibake, and the loop that
#     waits for the tables never finished. Patch D maps both spellings of that
#     CFStringEncoding (0x940 and 0x80000940) to one NSStringEncoding and
#     decodes it with encoding_rs::EUC_KR, which is already a dependency of the
#     crate; it leaves the unsupported-encoding fallback in place for every
#     other encoding.
#   patch E (v6) is instrumentation, like patch B. The v5 core starts the game,
#     runs its render loop at 60 FPS and still shows an almost black screen, and
#     the v5 log could only offer the *first* texture upload of the run (a 1x1
#     placeholder, which is what a failed image load leaves behind). Patch E
#     traces every guest open()/fopen()/NSFileHandle call (one hook in
#     posix_io::open_direct) and every "read this whole file" call (one hook in
#     Fs::read), every glTexImage2D and glCompressedTexImage2D upload with its
#     size, a count of glDrawArrays/glDrawElements, and one cumulative
#     "FS SUMMARY" line every 600 guest frames.
#   patch F (v7) is instrumentation too, and it follows up what the v6 log
#     found: only nine files were read at all (none of them a game resource),
#     and all 30 "FSOPEN ok" lines point at the same *directory*, <App>/Documents,
#     retried about once every ten frames. Patch E could not see why, because the
#     path is built and probed in calls that never open anything. Patch F adds: a
#     "PATHJOIN WARNING" line whenever -[NSString
#     stringByAppendingPathComponent:] gets a nil or empty component (that is
#     exactly how ".../Documents" + "" stays ".../Documents", i.e. how a file
#     name is lost), "FSEXIST"/"FSLIST"/"FSATTR"/"FSREADABLE"/"FSWRITABLE" lines
#     for the NSFileManager probe calls, "FSWRITE" for every open() that asks to
#     write or create and "FSCREATE" for every "write this whole file" call
#     (NSData writeToFile:, NSFileManager createFileAtPath:, NSString
#     writeToFile:, ...), the guest PC of a failed open, and a summary at frame
#     60 and every 300 frames plus a final one on exit (a device run is only a
#     few hundred frames long, so patch E's 600-frame line never fired there).
#     No return value and no branch of the emulated call is touched; the rate
#     limit, the counters and the summary cadence live in the new
#     src/fs_probe.rs.
#   patch G (new in v8) is instrumentation too, and it answers the one question
#     patch F left open. The v7 device log is unambiguous about the mechanism:
#     27 of the 28 uploaded textures are 1x1 placeholders (only the 512x32 font
#     atlas is real), and the same path, <App>/Documents, is opened about once
#     every 13 frames forever, because the app calls -[NSString
#     stringByAppendingPathComponent:] with a nil or empty component and
#     ".../Documents" + "" stays ".../Documents". What the log cannot say is
#     *which* guest code produced the nil. Patch G adds: a "PATHJOIN ORIGIN" line
#     beside patch F's warning, carrying the guest program counter and the guest
#     return address of the very call that dropped the component (the two
#     addresses locate the caller in a disassembly of the app); an "NSDEFAULTS"
#     line for every NSUserDefaults key lookup (objectForKey:, stringForKey:,
#     arrayForKey:, dictionaryForKey:, boolForKey:, integerForKey:) with the key
#     and a one-token summary of the result, because a stringForKey: that answers
#     nil is passed straight into stringByAppendingPathComponent: and is the
#     most likely source of the nil; an "NSREAD" line for the whole-file
#     NSString/NSData readers, which patch E could only count and never name; and
#     "FSBYTES", the length and the first 32 bytes of the three files the app
#     creates in its own container (Documents/DnfSlot, Documents/DnfOpt and
#     Library/Preferences/com.nexonmobile.dnfswordman.plist), so an empty or
#     all-zero file can be recognised at a glance. Like B, E and F it changes no
#     return value and no branch, the rate limit lives in the new
#     src/fs_origin.rs, and patch G does not edit a single line patches A-F
#     inserted.
#   patch H (new in v9) is instrumentation too, and it finishes the search patch
#     G started. The v8 device log showed that patch G's single `pc`/`ret` pair
#     is not a caller at all: `pc` is the same `cmn r3,#2` state-machine
#     instruction on every occurrence and `ret` disassembles to data tables. A
#     program counter plus a link register is not a call stack, so patch H stops
#     reading those registers and reuses the call-stack mechanism touchHLE
#     already has for its own panic backtrace - the "Attempting to produce stack
#     trace for current thread (#0)" output. It adds one read-only method beside
#     that unwinder, `Environment::guest_stack_frames`, which walks the very same
#     AAPCS frame-pointer chain (`[fp]` is the caller's frame pointer, `[fp + 4]`
#     its return address) and returns the addresses instead of printing them, and
#     it prints roughly twelve frames at the exact place the component is
#     dropped: a "PATHJOIN STACK" header and one "#n 0x..." line, for the first
#     three occurrences only. It also completes two small gaps the v8 log showed:
#     "NSDEFAULTSSET" traces every NSUserDefaults write (setObject:forKey:,
#     setBool:forKey:, setInteger:forKey:, removeObjectForKey:) with the key and
#     a one-token summary of the stored value, so a later stringForKey: that
#     answers nil can be matched against what was written; and "PATHFOUND" names
#     every resource lookup that *succeeded* (patch B/C only named the failures),
#     the first 40 in full and one in 100 afterwards. Like B, E, F and G it
#     changes no return value and no branch, and it does not edit a single line
#     patches A-G inserted - the panic backtrace and patch G's module are
#     untouched, and the new lines go beside the existing ones.
#   patch I (new in v10) fixes a bug instead of instrumenting one. The v9 device
#     log and the disassembly of the guest (fat slice 1, armv7s) agree on the
#     root cause: the code that produces the empty path component builds the file
#     name with `___vsprintf_chk(buf, 0, -1, format, ap)` after zeroing `buf`, and
#     the emulator declared that routine with the six-argument order of
#     `__vsnprintf_chk`. Apple's `__vsprintf_chk` has five parameters - `(str,
#     flag, slen, format, ap)` - so the emulator read `maxlen = <flag> = 0`, and
#     the delegated `vsnprintf` answered the length question without writing a
#     byte (`if n == 0 { return ...; }`). The buffer stayed all-zero, the name was
#     the empty string, `stringByAppendingPathComponent:` dropped it, and the game
#     re-opened `<App>/Documents` as a directory about once every 13 frames for
#     the whole run: the 36 `component=<empty>` warnings and the 28 all-1x1
#     texture uploads of the v7/v9 logs. Patch I corrects the signature, treats
#     `slen == -1` (the fortify macro's "unbounded") by delegating to the existing
#     `vsprintf` rather than asking `vsnprintf` for a four-gigabyte slice, keeps a
#     real `slen` bounded through `vsnprintf`, fixes the export entry to five
#     placeholders, and logs the first 20 calls (`VSPRINTFCHK`). An audit of the
#     other nine printf-family entries against Apple's libc found no other wrong
#     signature; they are untouched.
#   patch K (new in v12) fixes a bug too, and it is the other half of patch A's
#     story. Patch A added `CFURLCreateDataAndPropertiesFromResource`, but it
#     read the resource with `std::fs`, and the "file-system representation" it
#     is handed is a *guest* path - `/var/mobile/Applications/<fake-UUID>/<App>.app/
#     42049.act` - which exists only in touchHLE's virtual filesystem (for an app
#     bundle, as a member of the `.ipa` ZIP archive). The host has no such file,
#     so the lookup returned `kCFURLUnknownError` (-10) for every resource the app
#     loads this way, the game printed `Fail to Create data` and dropped it, and
#     because the read bypassed `env.fs` none of patch E's FSOPEN/FSREAD, patch
#     F's probes or patch G's FSBYTES lines could report it either: that is the
#     v10 device log exactly - 39 resources named by patch H's PATHFOUND with no
#     file operation after them, 39 errors, and every texture the 1x1 placeholder.
#     Patch K moves the size and the bytes to `env.fs.size`/`env.fs.read`, the one
#     guest entry point that resolves `.ipa` members and that patches E and G
#     trace, and adds a rate-limited `CFURLDATA url=... path=... len=... ok=...`
#     line for the first 40 calls. The signature, the `errorCode` values, the
#     `data`/`properties` out parameters, the `NSURLFileSize` key and the export
#     entry are patch A's, verbatim. The trace is a normal-level `log!`, not the
#     `log_dbg!` patch A used: `log::ENABLED_MODULES` is deliberately empty, so
#     debug-level logs never reach a device log, which is why the failure patch A
#     reported was never seen there. This is the app's only reading channel - it
#     imports no `open`/`fopen`/`read` at all, and its `Documents`/`English`/
#     `Fail to Create data`/`Error` string table is this load path's fingerprint -
#     so patch K has to be complete rather than partial: it depends on nothing but
#     the guest path `getFileSystemRepresentation:` returns, and it changes no
#     language or `NSBundle` logic (the app hard-codes the "English"
#     localization, which is unrelated to this bug). v12 is based on v10 rather
#     than v11 so that the device log stays as clean as the v10 one.
#   patch M (new in v16) is a real fix, and it is the other half of patch L. Patch
#     L made the *text* paths CJK-aware, but the app under test showed no
#     `CJKFONT` and no `CJKNODEF` line at all, so its text never reaches them. The
#     remaining system-font route is the glyph-id one: `CTFontGetGlyphsForCharacters`
#     and `CGFontGetGlyphsForUnichars` turn characters into ids, and
#     `CGContextShowGlyphsAtPoint`/`...AtPositions`/`...WithAdvances` draw those
#     ids. A glyph id is an index into one font's `cmap`, so an id produced by a
#     Latin face and drawn by a Latin face is `.notdef` - the empty box - and an id
#     produced by one face and drawn by another is an arbitrary wrong glyph. Patch
#     L could not touch that half on its own for exactly that reason, and this
#     patch is the missing half: the character-to-id step substitutes the
#     CJK/Arabic fallback face only for characters the caller's own font cannot
#     draw, records the face that produced each substituted id, and the drawing
#     entry points draw a run with the recorded face - but only when *every* id in
#     the run came from that one face, so a run containing an id from anywhere else
#     keeps the caller's font and nothing is ever drawn with the wrong face. An id
#     two different faces produced is dropped as ambiguous rather than resolved.
#     The returned `all_mapped` flag keeps the meaning it has on iOS for the font
#     the caller passed in, so no app's control flow changes. Because a log that
#     only fires on a suspicious run cannot test whether the app uses this pipeline
#     at all, the three new traces are unconditional and rate limited (first 40
#     calls, then one line every 200): `CTFONTGLYPHS ctfont=... key=... chars=...
#     cjk=... arabic=... base_notdef=... substituted=... notdef_out=...`,
#     `CGFONTGLYPHS font=... chars=... cjk=... base_notdef=... substituted=...` and
#     `CGGLYPHS <entry> font=... key=... size=... n=... notdef=... ids=[...]
#     draw_with=...`. A device log with none of them proves the boxes are not
#     produced by the emulator's font stack at all; one with `cjk > 0` and
#     `notdef_out > 0` while the boxes persist proves they are not produced here
#     either. v16 is v15 (A-K, v13, v14) plus this one patch.
# The artifact is named hyperhle-core-ios-arm64-v16 so it cannot be mistaken for
# the v1..v15 dylibs.
name: Build iOS emulator core (dylib)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-core:
    # Pinned rather than `macos-latest` on purpose: that label can move to a
    # newer image at any time, and a surprise image change is exactly what
    # turns a 30 minute run into a wasted one. macos-15 is current and is an
    # Apple Silicon (arm64) runner. If this image is ever retired, change the
    # line to macos-latest.
    runs-on: macos-15
    # Fails fast instead of hanging for GitHub's 6 hour default.
    timeout-minutes: 180

    steps:
      - name: Check out Applesauce at the pinned commit, with all submodules
        uses: actions/checkout@v4
        with:
          repository: 0xjohnnydev/Applesauce
          ref: e8e9d674a84903b14da0d9deb1dbe4f1dc735624
          # Includes the nested SDL checkout inside vendor/rust-sdl2, which
          # the shared SDL2 build compiles.
          submodules: recursive
          # Full history and tags: touchHLE_version asks `git describe`.
          fetch-depth: 0
          fetch-tags: true

      - name: Show the checked-out revision and submodules
        run: |
          set -eu
          git rev-parse HEAD
          git submodule status --recursive | sed 's/^/  /'

      - name: Choose the Xcode toolchain
        run: |
          set -eu
          echo "Xcode installations on this machine:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          # The project documents Xcode 26 or newer, so prefer it when the
          # image provides it; otherwise use whatever xcode-select already
          # points at. Only DEVELOPER_DIR is exported, no global state changes.
          dev_dir=
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate/Contents/Developer" ]; then
              dev_dir="$candidate/Contents/Developer"
              break
            fi
          done
          if [ -z "$dev_dir" ]; then
            dev_dir=$(xcode-select -p)
          fi
          echo "DEVELOPER_DIR=$dev_dir" >> "$GITHUB_ENV"
          echo "Using DEVELOPER_DIR=$dev_dir"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install cmake, ninja and Boost headers
        run: |
          set -eu
          brew install cmake ninja boost
          boost_root="$(brew --prefix boost)/include"
          if [ ! -d "$boost_root/boost" ]; then
            echo "::error::Boost headers are not at $boost_root/boost"
            exit 1
          fi
          echo "TOUCHHLE_BOOST_ROOT=$boost_root" >> "$GITHUB_ENV"
          echo "Using TOUCHHLE_BOOST_ROOT=$boost_root"

      - name: Add the Rust iOS target
        run: |
          set -eu
          rustup target add aarch64-apple-ios
          rustup target list --installed | grep -qx aarch64-apple-ios
          echo "rustc:  $(rustc --version)"
          echo "cargo:  $(cargo --version)"
          echo "cmake:  $(cmake --version | head -1)"
          echo "ninja:  $(ninja --version)"
          echo "python: $(python3 --version)"

      - name: Patch in the missing CoreFoundation API, the logging instrumentation,
             the bundle-root fallback, the EUC-KR decoding, the file/texture tracing,
             the filesystem probe/write tracing, the path-origin tracing, the
             nil-component stack trace, the __vsprintf_chk signature fix and the
             guest-filesystem resource read, the shared touch/render geometry,
             the CJK/Arabic text fallback, the glyph-id .notdef trace and the
             CJK/Arabic glyph-id pipeline
        run: |
          set -eu
          set -o pipefail
          # The embedded scripts below ship gzip-compressed and base64-encoded: as plain
          # text they pushed this file past the size GitHub accepts for a workflow file.
          # gunzip_b64 expands one back to stdout. macOS base64 (BSD) spells decoding -D
          # where GNU coreutils spells it -d, so probe for the one this machine has.
          gunzip_b64() {
            if [ "$(printf 'aGk=' | base64 -d 2>/dev/null || true)" = "hi" ]; then
              base64 -d | gunzip
            else
              base64 -D | gunzip
            fi
          }
          # PATCH_A_PY: 7992 bytes, sha256 fb7f5c4abb6c77518f7d33a6ba18c8391ea48a4a0b258cf99b0c468139ea7c9b
