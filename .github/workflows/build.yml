          if 'crate::fs_origin::note_read_file("NSData", &path_str, None);' in data_body:
              if not data_body.index("let Ok(bytes) = env.fs.read") < data_body.index('crate::fs_origin::note_read_file("NSData", &path_str, None);') < data_body.rindex("release(env, this);"):
                  problems.append("src/frameworks/foundation/ns_data.rs: the failed-read trace is not in the failure arm")

          # G5: the watched-file dump is inside patch E's wrapper, after its counter and
          # before the value is returned, and read_inner is byte for byte the old body.
          wrapper = fs[fs.index("pub fn read<P: AsRef<GuestPath>>(&self, path: P) -> Result<Vec<u8>, ()> {"):]
          wrapper = wrapper[:wrapper.index("\n    }")]
          order = ["crate::fs_trace::note_read(path.as_ref().as_str(), bytes_read);",
                   "if let Ok(bytes) = result.as_ref() {",
                   "crate::fs_origin::note_special_file(path.as_ref().as_str(), bytes);",
                   "\n        result"]
          for needed in order:
