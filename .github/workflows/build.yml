          # H1: the guest unwinder. The walk is a copy of the loop in
          # `stack_trace_for_thread` (it reads `[fp]` and `[fp + 4]` the same way), kept
          # separate on purpose so that the panic path is not touched at all.
          ENV_METHOD = '''    /// Patch H (v9): the guest return addresses of the current thread's call
              /// stack, newest call first.
              ///
              /// This walks the same AAPCS frame-pointer chain that
              /// [Self::stack_trace_for_thread] walks for the panic backtrace
              /// ("Attempting to produce stack trace for current thread (#0)"): entry 0
              /// is the guest program counter, entry 1 the guest link register, and each
              /// later entry is one older frame's saved return address, read through
              /// `[fp]` (the caller's frame pointer) and `[fp + 4]` (the caller's return
              /// address). touchHLE maintains that chain deliberately - see
              /// `abi::impl_CallFromHost` and its "this makes stack traces work nicely"
              /// comment - which is why it names a caller reliably, unlike the single
              /// `PC`/`LR` pair patch G recorded (on the v8 device those landed on a
              /// state-machine instruction and on data tables).
              ///
              /// [Self::stack_trace_for_thread] itself is left byte for byte as it was:
              /// it prints through `echo_no_panic!` and returns nothing, so reusing it
              /// would mean changing the panic path. This method repeats that walk and
              /// returns the addresses instead, bounded to `max` entries and stopped at
              /// the thread's stack boundary and at touchHLE's host / thread-exit
              /// routines. Read-only: it reads the CPU registers, guest memory and the
              /// two dyld routine addresses, and writes only its own `Vec`.
              pub(crate) fn guest_stack_frames(&self, max: usize) -> Vec<u32> {
                  let mut frames = Vec::new();
                  if self.current_thread >= self.threads.len() {
                      return frames;
                  }
                  let Some(stack_range) = self.threads[self.current_thread].stack.clone() else {
                      return frames;
                  };
                  let (regs, cpsr) = (*self.cpu.regs(), self.cpu.cpsr());
                  let return_to_host_routine_addr = self.dyld.return_to_host_routine().addr_with_thumb_bit();
                  let thread_exit_routine_addr = self.dyld.thread_exit_routine().addr_with_thumb_bit();

                  // Entry 0: the program counter, with the thumb bit the panic backtrace
                  // also prints it with.
                  let pc_nothumb = regs[cpu::Cpu::PC];
                  let thumb = (cpsr & cpu::Cpu::CPSR_THUMB) == cpu::Cpu::CPSR_THUMB;
                  let pc = GuestFunction::from_addr_and_thumb_flag(pc_nothumb, thumb);
                  frames.push(pc.addr_with_thumb_bit());

                  // Entry 1: the link register, unless it is not a guest address at all.
                  let mut lr = regs[cpu::Cpu::LR];
                  if lr == return_to_host_routine_addr || lr == thread_exit_routine_addr {
                      return frames;
                  }
                  frames.push(lr);

                  // Entries 2..: the frame-pointer chain, exactly as the panic backtrace
                  // walks it.
                  let mut fp: mem::ConstPtr<u8> = mem::Ptr::from_bits(regs[abi::FRAME_POINTER]);
                  while frames.len() < max {
                      if !stack_range.contains(&fp.to_bits()) {
                          break;
                      }
                      lr = self.mem.read((fp + 4).cast());
                      fp = self.mem.read(fp.cast());
                      if lr == return_to_host_routine_addr || lr == thread_exit_routine_addr {
                          break;
                      }
                      frames.push(lr);
                  }
                  frames
              }

