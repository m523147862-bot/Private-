          //! eight full lines per `NSUserDefaults` `(key, result)` pair and one in a
          //! hundred afterwards, small head budgets for the three rare line kinds, and a
          //! global backstop for an app that produces thousands of different keys.

          use std::collections::HashMap;
          use std::sync::atomic::{AtomicU32, Ordering};
          use std::sync::{Mutex, OnceLock};

          /// Full lines per `NSUserDefaults` `(key, result)` pair before sampling starts.
          ///
          /// A defaults lookup can run every frame (the app reads its own preferences
          /// while it initialises), and the same key answering the same thing is not new
          /// information after a few lines. Eight is enough to see the first decisions of
          /// a run in context.
          const DEFAULTS_HEAD: u32 = 8;
          /// After the head, one call in this many prints, per `(key, result)` pair.
          const DEFAULTS_SAMPLE: u32 = 100;

          /// Full lines per path for [note_path_component_origin].
          ///
          /// Deliberately the same shape as patch F's `PATHJOIN WARNING` failure policy
          /// (16 then 1 in 25) so this line stays paired with the warning it belongs to:
          /// both are driven by the same `if` in `stringByAppendingPathComponent:`.
          const ORIGIN_HEAD: u32 = 16;
          const ORIGIN_SAMPLE: u32 = 25;

          /// Full lines per path for [note_read_file]: a whole-file read is a rare event
          /// (the v6 log has nine of them for a whole run), so a small head is plenty.
          const READ_HEAD: u32 = 4;
          const READ_SAMPLE: u32 = 100;

          /// Full lines per path for [note_special_file]. Only three paths are watched,
          /// so this is a formality; it exists so a path that *is* read every frame
          /// cannot flood the log.
          const SPECIAL_HEAD: u32 = 4;
          const SPECIAL_SAMPLE: u32 = 100;

          /// How many bytes of a watched file [note_special_file] prints.
          const BYTES_PREFIX: usize = 32;

          /// Backstop for the case the per-key budget cannot bound: an app producing
          /// thousands of *different* keys. After this many patch G lines (all kinds
          /// together) only one event in [GLOBAL_SAMPLE] prints.
          const GLOBAL_BUDGET: u32 = 3000;
          const GLOBAL_SAMPLE: u32 = 100;
          /// Number of distinct keys the rate-limit table remembers. Entries are keyed by
          /// a hash, so the table never keeps a copy of a key and stays small.
          const MAX_TRACKED_KEYS: usize = 4096;

          /// The three files the app creates in its own container and, per the v7 log,
          /// never reads back. Matched on the last path component, which is what survives
          /// every spelling the app uses (`<App>/Documents/DnfSlot`,
          /// `<App>/Library/Preferences/com.nexonmobile.dnfswordman.plist`).
          const WATCHED_FILES: [&str; 3] = ["DnfSlot", "DnfOpt", "com.nexonmobile.dnfswordman.plist"];

          /// Patch G lines printed so far (all kinds), for the global backstop.
          static LINES: AtomicU32 = AtomicU32::new(0);

          fn key_table() -> &'static Mutex<HashMap<u64, u32>> {
              static TABLE: OnceLock<Mutex<HashMap<u64, u32>>> = OnceLock::new();
              TABLE.get_or_init(|| Mutex::new(HashMap::new()))
