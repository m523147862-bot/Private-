          /// Printed beside patch F's `PATHJOIN WARNING` and patch G's `PATHJOIN ORIGIN`,
          /// for the same call, when the rate limit allows it. `frames` are the guest
          /// addresses the emulator's own `guest_stack_frames` read from the guest's
          /// frame-pointer chain: entry 0 is the guest program counter, entry 1 the link
          /// register / current return address, and each later entry one older return
          /// address. Unlike patch G's single `pc`/`ret` pair - which on the v8 device
          /// turned out to be a state-machine instruction and two data-table addresses -
          /// this chain is the same one touchHLE's own panic backtrace walks, so entry 2
          /// and later name the guest functions that called into
          /// `stringByAppendingPathComponent:`. The first [STACK_TRACES_MAX] occurrences
          /// print; after that only the two lines patch F and patch G already print
          /// appear, so the log cannot flood.
          pub fn note_path_component_stack(base: &str, component_is_nil: bool, frames: &[u32]) {
