          //!
          //! Line formats (short and greppable on purpose):
          //!
          //! ```text
          //! PATHJOIN ORIGIN base="<path>" component=<nil|empty> pc=0x<hex> ret=0x<hex>
          //! NSDEFAULTS <selector> key="<key>" -> <nil|str(len=N)|<class name>>
          //! NSREAD <NSString|NSData> <guest path> -> nil
          //! NSREAD <NSString|NSData> <guest path> -> ok(len=<n>)
