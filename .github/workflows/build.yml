          /// match and the empty-name shim), so the log shows which of the files the app
          /// asked for actually exist. Patch B/C only named the lookups that *failed*.
          /// Rate limit: the first [FOUND_HEAD] successes print in full, then one in
          /// [FOUND_SAMPLE], because a run can look up the same asset repeatedly.
          pub fn note_path_found(path: &str) {
              let printed = PATH_FOUND_LINES.fetch_add(1, Ordering::Relaxed);
              if printed >= FOUND_HEAD && printed % FOUND_SAMPLE != 0 {
                  return;
              }
              log!("PATHFOUND {}", path);
          }
          '''


