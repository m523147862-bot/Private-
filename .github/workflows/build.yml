                  Some(entries) => {
                      LIST_OK.fetch_add(1, Ordering::Relaxed);
                      if should_print(path, false) {
                          log!("FSLIST {} n={}", path, entries);
                      }
                  }
                  None => {
                      LIST_ERR.fetch_add(1, Ordering::Relaxed);
                      if should_print(path, true) {
                          log!("FSLIST ERR {} err=guest-fs", path);
                      }
                  }
              }
          }

          /// `-[NSFileManager attributesOfItemAtPath:error:]`.
          ///
          /// `size` is 0 for a directory and for the error case, so the `isdir` field is
          /// what tells those two apart.
          pub fn note_attributes(path: &str, exists: bool, is_dir: bool, size: usize) {
              if exists {
                  ATTRS_OK.fetch_add(1, Ordering::Relaxed);
                  if should_print(path, false) {
                      log!(
                          "FSATTR {} ok=1 isdir={} size={}",
                          path,
                          is_dir as u8,
                          size
                      );
                  }
              } else {
                  ATTRS_ERR.fetch_add(1, Ordering::Relaxed);
                  if should_print(path, true) {
                      log!("FSATTR ERR {} err=guest-fs", path);
                  }
              }
          }

          /// `-[NSFileManager isReadableFileAtPath:]` (`writable = false`) and
          /// `-[NSFileManager isWritableFileAtPath:]` (`writable = true`).
          ///
          /// Only failures are counted for the summary: every existing file is readable
          /// and writable in touchHLE, so the interesting case is an answer of NO.
          pub fn note_access(path: &str, writable: bool, ok: bool) {
              if !ok {
                  if writable {
                      WRITABLE_ERR.fetch_add(1, Ordering::Relaxed);
                  } else {
                      READABLE_ERR.fetch_add(1, Ordering::Relaxed);
                  }
              }
              if !should_print(path, !ok) {
                  return;
              }
              if writable {
                  log!("FSWRITABLE {} ok={}", path, ok as u8);
              } else {
                  log!("FSREADABLE {} ok={}", path, ok as u8);
              }
          }

          /// `-[NSString stringByAppendingPathComponent:]` with a nil or empty
          /// component.
          ///
          /// `path_algorithms::string_by_appending_path_component` drops empty
          /// components, so this call returns `base` unchanged: the caller asked for
          /// "base/name" and got "base". That is how a file name disappears and leaves a
          /// directory path behind - the path the v6 log shows being opened 30 times.
          pub fn note_path_component(base: &str, component_is_nil: bool) {
              PATHJOIN_EMPTY.fetch_add(1, Ordering::Relaxed);
              if !should_print(base, true) {
                  return;
              }
              log!(
                  "PATHJOIN WARNING base={:?} component=<{}>",
                  base,
                  if component_is_nil { "nil" } else { "empty" }
              );
          }

          /// An `open()`-class call that asks to write or create, from
          /// `crate::libc::posix_io::open_direct`.
          ///
          /// That is the one choke point every `open()`, `creat()`, `fopen()` and
          /// `NSFileHandle` writing factory (`fileHandleForWritingAtPath:`,
          /// `fileHandleForUpdatingAtPath:`) goes through. `flags` is the guest's
          /// `open()` flag word, so a failed create (`O_CREAT`) and a failed update
          /// (`O_WRONLY`/`O_RDWR`) can be told apart.
          pub fn note_write_open(path: &str, flags: i32, ok: bool) {
              if ok {
                  WRITE_OPENS_OK.fetch_add(1, Ordering::Relaxed);
                  if should_print(path, false) {
                      log!("FSWRITE {} flags={:#x} ok=1", path, flags);
                  }
              } else {
                  WRITE_OPENS_ERR.fetch_add(1, Ordering::Relaxed);
                  if should_print(path, true) {
                      log!("FSWRITE {} flags={:#x} ok=0 err=guest-fs", path, flags);
                  }
              }
          }

          /// A "write this whole file" call, from `crate::fs::Fs::write`.
          ///
          /// `Fs::write` opens with write+create+truncate, so this covers
          /// `-[NSData writeToFile:atomically:]` (and therefore
          /// `writeToFile:options:error:`, `writeToURL:...`,
          /// `-[NSFileManager createFileAtPath:contents:attributes:]`),
          /// `-[NSString writeToFile:...]`, `NSArray`/`NSDictionary writeToFile:`,
          /// `NSKeyedArchiver` and `NSUserDefaults`. A failure here with a path that is
          /// a directory is the direct evidence for "the app tried to create a save or
          /// marker file and could not".
          pub fn note_write_file(path: &str, ok: bool) {
              if ok {
                  WRITE_FILES_OK.fetch_add(1, Ordering::Relaxed);
                  if should_print(path, false) {
                      log!("FSCREATE {} ok=1", path);
                  }
              } else {
                  WRITE_FILES_ERR.fetch_add(1, Ordering::Relaxed);
                  if should_print(path, true) {
                      log!("FSCREATE {} ok=0 err=guest-fs", path);
                  }
