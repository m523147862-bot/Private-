          if "let exists = env.fs.exists(GuestPath::new(&path)); // All existing files are writable\n    // Patch F (v7): the writable half of the pair, and the one that matters for\n    // the \"the app cannot write its save/marker file\" hypothesis.\n    crate::fs_probe::note_access(&path, true, exists);\n    exists\n}" not in fm:
              problems.append("ns_file_manager.rs: isWritableFileAtPath: does not return the value it traces")
