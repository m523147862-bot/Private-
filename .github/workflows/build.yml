              ("- (id)stringForKey:(id)key {", "stringForKey:", "let val: id = msg![env; this objectForKey:key];"),
              ("- (id)arrayForKey:(id)key {", "arrayForKey:", "let val: id = msg![env; this objectForKey:key];"),
              ("- (id)dictionaryForKey:(id)key {", "dictionaryForKey:", "let val: id = msg![env; this objectForKey:key];"),
              ("- (bool)boolForKey:(id)key { // NSString *", "boolForKey:", "let val: id = msg![env; this objectForKey:key];"),
              ("- (NSInteger)integerForKey:(id)key {", "integerForKey:", "let val: id = msg![env; this objectForKey:key];"),
          ):
