# Builds the iOS emulator core (libhyperhle_core.dylib) for Applesauce on a
# GitHub-hosted macOS machine, so the core can be built without owning a Mac.
#
# How to use it: put this file in a repository as .github/workflows/build.yml,
# then open the Actions tab, pick "Build iOS emulator core (dylib)" and press
# "Run workflow". A run takes about 20-40 minutes; the finished dylib is in the
# Artifacts section at the bottom of the run page.
#
# Nothing needs to be forked. The job checks out the upstream Applesauce
# repository at a fixed commit on the runner itself, applies four patches,
# builds the core, verifies the result and uploads it. This file is the only
# file the account running it needs.
#
# Builds the iOS emulator core (libhyperhle_core.dylib) for Applesauce on a
# GitHub-hosted macOS machine, so the core can be built without owning a Mac.
#
# How to use it: put this file in a repository as .github/workflows/build.yml,
# then open the Actions tab, pick "Build iOS emulator core (dylib)" and press
# "Run workflow". A run takes about 20-40 minutes; the finished dylib is in the
# Artifacts section at the bottom of the run page.
#
# Nothing needs to be forked. The job checks out the upstream Applesauce
# repository at a fixed commit on the runner itself, applies five patches,
# builds the core, verifies the result and uploads it. This file is the only
# file the account running it needs.
#
# This is the v6 variant of build-core.yml (v1). v2 added the logging; v3 added
# the first patch that fixes a bug instead of instrumenting one; v4 corrected
# that patch and added two fields to the log it was hidden behind; v5 makes the
# emulator decode EUC-KR, the encoding the app asks for; v6 adds the
# file-access and texture-upload tracing that explains a black screen (it is
# instrumentation only, like v2's):
#   patch A (identical to v1) adds the missing CoreFoundation entry point
#     CFURLCreateDataAndPropertiesFromResource, the reason games showed a black
#     screen;
#   patch B is instrumentation only, it changes no behaviour, no return value
#     and no control flow: it makes the warnings about a missing bundle resource
#     and about reading/seeking a directory print the real guest paths instead
#     of ObjC pointers, so "Fail to Create data" can be traced to the exact file
#     the app was looking for. The only lines it touches are log! arguments;
#   patch C fixes the bundle-resource lookup. On a device the core reported 38
#     .png files as missing that all really exist in the app bundle root
#     (nexon-co.png, back.png, ...), because touchHLE only ever tried localized
#     .lproj paths. v3's retry dropped the lproj but still passed the caller's
#     directory (the log shows it was "English.lproj"), so it recomputed a path
#     the function had already tried and nothing changed. v4 passes nil for both
#     lproj and directory, the only combination that reaches the plain
#     <bundle>/<name> path, and logs the directory and lproj of every failed
#     lookup so the two components can no longer be confused.
#   patch D (v5) teaches the core the one encoding the app under test keeps
#     asking for and touchHLE did not implement: EUC-KR. A v4 run printed
#     14,420 "Unhandled CFStringEncoding 0x940" warnings (9,349 of them in a
#     row, and nothing else) while the game sat at 26% of its loading bar.
#     0x940 is kCFStringEncodingEUC_KR, so the app's Korean text tables fell
#     through to the UTF-8 default, the game read mojibake, and the loop that
#     waits for the tables never finished. Patch D maps both spellings of that
#     CFStringEncoding (0x940 and 0x80000940) to one NSStringEncoding and
#     decodes it with encoding_rs::EUC_KR, which is already a dependency of the
#     crate; it leaves the unsupported-encoding fallback in place for every
#     other encoding.
#   patch E (new in v6) is instrumentation, like patch B. The v5 core starts the
#     game, runs its render loop at 60 FPS and still shows an almost black
#     screen, and the v5 log can only offer the *first* texture upload of the
#     run (a 1x1 placeholder, which is what a failed image load leaves behind).
#     Patch E traces what the app really does: every guest open()/fopen()/
#     NSFileHandle call (one hook in posix_io::open_direct) and every "read this
#     whole file" call (one hook in Fs::read, which NSData, UIImage and
#     CGDataProvider all go through), every glTexImage2D and
#     glCompressedTexImage2D upload with its size, a count of glDrawArrays/
#     glDrawElements, and one cumulative "FS SUMMARY" line every 600 guest
#     frames. No pixel data is ever logged and no return value or branch is
#     touched; the rate limit and the counters live in the new src/fs_trace.rs.
# The artifact is named hyperhle-core-ios-arm64-v6 so it cannot be mistaken for
# the v1..v5 dylibs.
name: Build iOS emulator core (dylib)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-core:
    # Pinned rather than `macos-latest` on purpose: that label can move to a
    # newer image at any time, and a surprise image change is exactly what
    # turns a 30 minute run into a wasted one. macos-15 is current and is an
    # Apple Silicon (arm64) runner. If this image is ever retired, change the
    # line to macos-latest.
    runs-on: macos-15
    # Fails fast instead of hanging for GitHub's 6 hour default.
    timeout-minutes: 180

    steps:
      - name: Check out Applesauce at the pinned commit, with all submodules
        uses: actions/checkout@v4
        with:
          repository: 0xjohnnydev/Applesauce
          ref: e8e9d674a84903b14da0d9deb1dbe4f1dc735624
          # Includes the nested SDL checkout inside vendor/rust-sdl2, which
          # the shared SDL2 build compiles.
          submodules: recursive
          # Full history and tags: touchHLE_version asks `git describe`.
          fetch-depth: 0
          fetch-tags: true

      - name: Show the checked-out revision and submodules
        run: |
          set -eu
          git rev-parse HEAD
          git submodule status --recursive | sed 's/^/  /'

      - name: Choose the Xcode toolchain
        run: |
          set -eu
          echo "Xcode installations on this machine:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          # The project documents Xcode 26 or newer, so prefer it when the
          # image provides it; otherwise use whatever xcode-select already
          # points at. Only DEVELOPER_DIR is exported, no global state changes.
          dev_dir=
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate/Contents/Developer" ]; then
              dev_dir="$candidate/Contents/Developer"
              break
            fi
          done
          if [ -z "$dev_dir" ]; then
            dev_dir=$(xcode-select -p)
          fi
          echo "DEVELOPER_DIR=$dev_dir" >> "$GITHUB_ENV"
          echo "Using DEVELOPER_DIR=$dev_dir"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install cmake, ninja and Boost headers
        run: |
          set -eu
          brew install cmake ninja boost
          boost_root="$(brew --prefix boost)/include"
          if [ ! -d "$boost_root/boost" ]; then
            echo "::error::Boost headers are not at $boost_root/boost"
            exit 1
          fi
          echo "TOUCHHLE_BOOST_ROOT=$boost_root" >> "$GITHUB_ENV"
          echo "Using TOUCHHLE_BOOST_ROOT=$boost_root"

      - name: Add the Rust iOS target
        run: |
          set -eu
          rustup target add aarch64-apple-ios
          rustup target list --installed | grep -qx aarch64-apple-ios
          echo "rustc:  $(rustc --version)"
          echo "cargo:  $(cargo --version)"
          echo "cmake:  $(cmake --version | head -1)"
          echo "ninja:  $(ninja --version)"
          echo "python: $(python3 --version)"

      - name: Patch in the missing CoreFoundation API, the logging instrumentation,
             the bundle-root fallback, the EUC-KR decoding and the file/texture tracing
        run: |
          set -eu
          python3 - <<'PATCH_A_PY'
          #!/usr/bin/env python3
          """Add CFURLCreateDataAndPropertiesFromResource to the emulator core's CFURL.

          Applesauce's bundled HyperHLE core does not implement the legacy CFURLAccess
          entry point `CFURLCreateDataAndPropertiesFromResource`, so games that call it
          die while starting up (the visible symptom is a black screen). This script
          inserts the implementation, taken from KlugKlugTG/HyperHLE-Fork
          (src/frameworks/core_foundation/cf_url.rs), into an Applesauce checkout and
          registers it in the module's `FUNCTIONS` export table.

          The inserted code is deliberately self-contained: every path it needs that the
          target file does not already `use` is written out in full, so no import line has
          to be edited. Only one API is added; nothing else is copied from the fork.

          Usage: python3 patch_cf_url.py [repo-root]        (default: current directory)

          The script refuses to run unless the patch applies cleanly, and re-checks both
          the definition and the export afterwards, so a silent no-op is impossible.
          """

          import sys
          from pathlib import Path

          TARGET = "src/frameworks/core_foundation/cf_url.rs"

          # The function to insert, verbatim apart from fully-qualified paths (see above).
          FUNCTION_SRC = r'''
          // MARK: - Resource access (CFURLAccess.h)

          /// `Boolean CFURLCreateDataAndPropertiesFromResource(CFAllocatorRef alloc,
          ///     CFURLRef url, CFDataRef *data, CFDictionaryRef *properties,
          ///     CFTypeRef desiredProperties, SInt32 *errorCode)`
          ///
          /// Legacy CFURLAccess API: loads a resource's bytes and/or a dictionary of
          /// its properties. Apps use it (via their plist/XML glue) to read local
          /// files referenced by `file://` URLs.
          ///
          /// - `data` (optional) receives the resource contents as a CFData.
          /// - `properties` (optional) receives a dictionary with the properties named
          ///   in `desiredProperties` (or all known ones when it is NULL): we support
          ///   the file length, the one property callers actually consult.
          /// - `errorCode` (optional) receives `kCFURLSuccess` (0) or
          ///   `kCFURLUnknownError` (-10).
          #[allow(clippy::too_many_arguments)]
          fn CFURLCreateDataAndPropertiesFromResource(
              env: &mut Environment,
              _allocator: crate::frameworks::core_foundation::cf_allocator::CFAllocatorRef,
              url: CFURLRef,
              data: MutPtr<crate::frameworks::core_foundation::cf_data::CFDataRef>,
              properties: MutPtr<id>,
              _desired_properties: super::CFTypeRef,
              error_code: MutPtr<i32>,
          ) -> bool {
              const K_CF_URL_SUCCESS: i32 = 0;
              const K_CF_URL_UNKNOWN_ERROR: i32 = -10;

              if url.is_null() {
                  if !error_code.is_null() {
                      env.mem.write(error_code, K_CF_URL_UNKNOWN_ERROR);
                  }
                  return false;
              }

              // Get the file-system path for the URL.
              const PATH_MAX: crate::mem::GuestUSize = 4096;
              let path_buf: MutPtr<u8> = env.mem.alloc(PATH_MAX).cast();
              let ok: bool = msg![env; url getFileSystemRepresentation:path_buf maxLength:PATH_MAX];
              let path = if ok {
                  let cstr = env.mem.cstr_at_utf8(path_buf);
                  cstr.ok().map(|s| s.to_owned())
              } else {
                  None
              };
              env.mem.free(path_buf.cast());

              let Some(path) = path else {
                  if !error_code.is_null() {
                      env.mem.write(error_code, K_CF_URL_UNKNOWN_ERROR);
                  }
                  return false;
              };

              let file_len = std::fs::metadata(&path).map(|m| m.len()).ok();

              if !data.is_null() {
                  match std::fs::read(&path) {
                      Ok(bytes) => {
                          let length: CFIndex = bytes.len() as CFIndex;
                          let bytes_ptr =
                              env.mem.alloc(bytes.len().max(1) as crate::mem::GuestUSize);
                          env.mem
                              .bytes_at_mut(bytes_ptr.cast(), bytes.len() as crate::mem::GuestUSize)
                              .copy_from_slice(&bytes);
                          let cf_data = crate::frameworks::core_foundation::cf_data::CFDataCreate(
                              env,
                              super::cf_allocator::kCFAllocatorDefault,
                              bytes_ptr.cast::<u8>().cast_const(),
                              length,
                          );
                          env.mem.write(data, cf_data);
                      }
                      Err(err) => {
                          log_dbg!(
                              "CFURLCreateDataAndPropertiesFromResource: couldn't read {:?}: {}",
                              path,
                              err
                          );
                          if !error_code.is_null() {
                              env.mem.write(error_code, K_CF_URL_UNKNOWN_ERROR);
                          }
                          return false;
                      }
                  }
              }

              if !properties.is_null() {
                  let mut dict: id = msg_class![env; NSMutableDictionary dictionary];
                  if let Some(len) = file_len {
                      let key = get_static_str(env, "NSURLFileSize");
                      let len_i64 = len as i64;
                      let number: id = msg_class![env; NSNumber alloc];
                      let number: id = msg![env; number initWithLongLong:len_i64];
                      let _prev: () = msg![env; dict setObject:number forKey:key];
                      let _ = dict;
                  }
                  env.mem.write(properties, dict);
              }

              if !error_code.is_null() {
                  env.mem.write(error_code, K_CF_URL_SUCCESS);
              }
              true
          }
          '''.lstrip("\n")

          # The function goes just above the module's export table, and its entry goes
          # into that table.
          EXPORTS_ANCHOR = "// MARK: - Exports\n\npub const FUNCTIONS: FunctionExports = &[\n"
          EXPORT_ANCHOR = "    export_c_func!(CFURLRelease(_)),\n"
          EXPORT_ENTRY = (
              "    // Resource access (CFURLAccess.h, deprecated by Apple but used by apps)\n"
              "    export_c_func!(CFURLCreateDataAndPropertiesFromResource(_, _, _, _, _, _)),\n"
          )

          DEFINITION_MARKER = "fn CFURLCreateDataAndPropertiesFromResource("
          EXPORT_MARKER = "export_c_func!(CFURLCreateDataAndPropertiesFromResource"


          def fail(message):
              print("ERROR: " + message, file=sys.stderr)
              raise SystemExit(1)


          def main():
              repo = Path(sys.argv[1] if len(sys.argv) > 1 else ".")
              path = repo / TARGET
              if not path.is_file():
                  fail("{} does not exist".format(path))

              text = path.read_text(encoding="utf-8").replace("\r\n", "\n")

              definitions = text.count(DEFINITION_MARKER)
              if definitions > 1:
                  fail("{} already contains {} definitions of the function".format(path, definitions))

              if definitions == 0:
                  if text.count(EXPORTS_ANCHOR) != 1:
                      fail("cannot find the export table anchor ({} matches) in {}".format(
                          text.count(EXPORTS_ANCHOR), path))
                  if text.count(EXPORT_ANCHOR) != 1:
                      fail("cannot find the export anchor ({} matches) in {}".format(
                          text.count(EXPORT_ANCHOR), path))

                  text = text.replace(EXPORTS_ANCHOR, FUNCTION_SRC + "\n" + EXPORTS_ANCHOR, 1)
                  text = text.replace(EXPORT_ANCHOR, EXPORT_ANCHOR + EXPORT_ENTRY, 1)
                  print("Inserted the function and its export entry into {}".format(TARGET))
              elif text.count(EXPORT_MARKER) == 0:
                  print("The function is already present; adding the missing export entry")
                  if text.count(EXPORT_ANCHOR) != 1:
                      fail("function present but the export anchor is missing")
                  text = text.replace(EXPORT_ANCHOR, EXPORT_ANCHOR + EXPORT_ENTRY, 1)
              else:
                  print("The function and its export entry are already present; nothing to do")

              # Post-conditions: exactly one definition, exactly one export, and the file
              # is still brace-balanced (catches a truncated or duplicated insertion).
              if text.count(DEFINITION_MARKER) != 1:
                  fail("expected exactly 1 definition, found {}".format(text.count(DEFINITION_MARKER)))
              if text.count(EXPORT_MARKER) != 1:
                  fail("expected exactly 1 export entry, found {}".format(text.count(EXPORT_MARKER)))
              if text.count("{") != text.count("}"):
                  fail("unbalanced braces: {} '{{' vs {} '}}'".format(text.count("{"), text.count("}")))

              with open(path, "w", encoding="utf-8", newline="\n") as output_file:
                  output_file.write(text)
              print("Wrote {}".format(path))


          if __name__ == "__main__":
              main()
          PATCH_A_PY
          python3 - <<'PATCH_B_PY'
          #!/usr/bin/env python3
          """Logging-only instrumentation (patch B) for the Applesauce iOS core.

          Counterpart of patch_cf_url.py: that script adds a missing CoreFoundation API
          and therefore changes behaviour, this one changes nothing but the text of
          `log!` warnings. Every edit below either adds arguments to an existing `log!`
          or declares a local variable that only those arguments read. No return value,
          no control flow, no data structure and nothing the guest can observe is
          touched, so a core built with this patch plus patch A must behave exactly like
          one built with patch A alone and only print more.

          What it makes visible:

            B1  src/frameworks/foundation/ns_bundle.rs
                `NSBundle resource lookup: {:?} missing, Unity Data fallback {:?}
                exists={}` passed `path` and `data_path`, which are ObjC object ids, to
                `{:?}`, so the log contained two guest pointers instead of the resource
                it was looking for. It now logs real Rust strings, converted with the
                same `ns_string::to_rust_string` helper the function already uses a few
                lines above, plus the requested name and extension. `directory` is
                intentionally left out; the replacement text below says why.

            B2  src/libc/posix_io.rs
                `read()`'s error warning (the one that reports "Attempt to read from a
                directory as a guest file") and `lseek()`'s directory warnings now name
                the guest path the fd was opened with. That path is already recorded in
                `PosixFileHostObject::path` (the same field `fcntl(F_GETPATH)` reads), it
                was simply never logged.

            B3  src/fs.rs
                "Seeking a directory as a guest file!" is emitted by
                `impl Seek for GuestFile` for `GuestFile::Directory`, a unit variant that
                carries neither a path nor an fd, so nothing more can be printed there.
                The warning text is kept intact and gains a pointer to the `lseek()`
                warning that follows it, which does report both.

          Usage: python3 patch_logging_v2.py [repo-root]      (default: current directory)

          The script applies each edit by exact text replacement, refuses to run unless
          every anchor matches the expected number of times, skips edits that are already
          applied (running it twice is safe) and re-checks every marker afterwards.
          """

          import sys
          from pathlib import Path

          NS_BUNDLE = "src/frameworks/foundation/ns_bundle.rs"
          POSIX_IO = "src/libc/posix_io.rs"
          FS = "src/fs.rs"

          # An edit is (name, target file, anchor text, replacement, occurrences of the
          # anchor that must be found, marker that proves the replacement landed).
          #
          # The Rust snippets are raw strings: a backslash at the end of a line is the
          # line continuation inside the Rust string literal, exactly as in the source.
          EDITS = [
              (
                  "B1 ns_bundle logs the real resource paths",
                  NS_BUNDLE,
                  r'''    log!(
                  "NSBundle resource lookup: {:?} missing, Unity Data fallback {:?} exists={}",
                  path,
                  data_path,
                  data_path_exists
              );
          ''',
                  r'''    // Instrumentation only: `path` and `data_path` are ObjC object ids, so
              // `{:?}` printed guest pointers and the log never said which resource was
              // actually missing. Convert them with the same helper the checks above use
              // for `name`, and include the requested name and extension.
              //
              // `directory` is deliberately not converted or logged here.
              // `to_rust_string` panics unless its argument is nil or a StringHostObject,
              // and this function never passes `directory` to it (the checks above
              // convert `name` and `extension`, not `directory`), so its host object
              // type is unproven and a panic in a log statement would take the whole
              // emulator down. It would also be redundant: `path` already has
              // `directory` appended to it a few lines above.
              let path_debug = ns_string::to_rust_string(env, path);
              let data_path_debug = ns_string::to_rust_string(env, data_path);
              let name_debug = ns_string::to_rust_string(env, name);
              let extension_debug = ns_string::to_rust_string(env, extension);
              log!(
                  "NSBundle resource lookup: {:?} missing, Unity Data fallback {:?} exists={} \
                   (name={:?} extension={:?})",
                  path_debug,
                  data_path_debug,
                  data_path_exists,
                  name_debug,
                  extension_debug
              );
          ''',
                  1,
                  "let path_debug = ns_string::to_rust_string(env, path);",
              ),
              (
                  "B2 read() keeps the fd's guest path",
                  POSIX_IO,
                  r'''    let buffer_slice = env.mem.bytes_at_mut(buffer.cast(), size);
              match file.file.read(buffer_slice) {
          ''',
                  r'''    // Instrumentation only: remember the guest path this fd was opened with
              // (`PosixFileHostObject::path`, the field fcntl(F_GETPATH) reports) so the
              // warning in the error arm below can name the file, not just the fd.
              let read_fd_path: Option<String> = file.path.clone();

              let buffer_slice = env.mem.bytes_at_mut(buffer.cast(), size);
              match file.file.read(buffer_slice) {
          ''',
                  1,
                  "let read_fd_path: Option<String> = file.path.clone();",
              ),
              (
                  "B2 read() logs that guest path",
                  POSIX_IO,
                  r'''            log!(
                          "Warning: read({:?}, {:?}, {:#x}) encountered error {:?}, \
                           returning {}",
                          fd,
                          buffer,
                          size,
                          e,
                          res
                      );
          ''',
                  r'''            log!(
                          "Warning: read({:?}, {:?}, {:#x}) encountered error {:?}, \
                           returning {} (guest path: {:?})",
                          fd,
                          buffer,
                          size,
                          e,
                          res,
                          read_fd_path
                      );
          ''',
                  1,
                  "returning {} (guest path: {:?})",
              ),
              (
                  "B2 lseek() keeps the fd's guest path",
                  POSIX_IO,
                  r'''        log!("lseek({:?}, {:#x}, {}) => {}", fd, offset, whence, -1);
                  set_errno(env, EBADF);
                  return -1;
              };

              if !file.file.is_seekable() {
          ''',
                  r'''        log!("lseek({:?}, {:#x}, {}) => {}", fd, offset, whence, -1);
                  set_errno(env, EBADF);
                  return -1;
              };

              // Instrumentation only: as in read() above, for the warnings in the error
              // arms below. `GuestFile::Directory` has no path of its own, but the fd
              // does, and this is the place where it is still known.
              let lseek_fd_path: Option<String> = file.path.clone();

              if !file.file.is_seekable() {
          ''',
                  1,
                  "let lseek_fd_path: Option<String> = file.path.clone();",
              ),
              (
                  "B2 lseek(SEEK_CUR/SEEK_END) logs that guest path",
                  POSIX_IO,
                  r'''                    std::io::ErrorKind::IsADirectory => set_errno(env, EISDIR),
          ''',
                  r'''                    std::io::ErrorKind::IsADirectory => {
                                  // Instrumentation only: fs.rs's "Seeking a directory
                                  // as a guest file!" warning has neither a path nor an
                                  // fd in scope; this is where both are known.
                                  log!(
                                      "Warning: lseek({:?}, {:#x}, {}) called on a guest directory; \
                                       guest path: {:?}. Returning EISDIR.",
                                      fd,
                                      offset,
                                      whence,
                                      lseek_fd_path
                                  );
                                  set_errno(env, EISDIR)
                              }
          ''',
                  2,
                  "called on a guest directory",
              ),
              (
                  "B2 lseek(SEEK_SET) logs that guest path",
                  POSIX_IO,
                  r'''            log!(
                          "Warning: lseek({:?}, {:#x}, {}) failed with error: {:?}, \
                           returning -1",
                          fd,
                          offset,
                          whence,
                          seek_error
                      );
          ''',
                  r'''            log!(
                          "Warning: lseek({:?}, {:#x}, {}) failed with error: {:?}, \
                           returning -1 (guest path: {:?})",
                          fd,
                          offset,
                          whence,
                          seek_error,
                          lseek_fd_path
                      );
          ''',
                  1,
                  "returning -1 (guest path: {:?})",
              ),
              (
                  "B3 fs.rs seek warning points at the lseek warning",
                  FS,
                  r'''                log!("Warning: Seeking a directory as a guest file!");
          ''',
                  r'''                // Instrumentation only: `GuestFile::Directory` is a unit
                          // variant, so this warning has neither a path nor an fd in
                          // scope. The lseek() that reported the error logs both, on the
                          // line right after this one.
                          log!(
                              "Warning: Seeking a directory as a guest file! \
                               (no path or fd at this layer; see the lseek warning that follows)"
                          );
          ''',
                  1,
                  "no path or fd at this layer",
              ),
          ]


          def fail(message):
              print("ERROR: " + message, file=sys.stderr)
              raise SystemExit(1)


          def main():
              repo = Path(sys.argv[1] if len(sys.argv) > 1 else ".")

              texts = {}
              for target in sorted({edit[1] for edit in EDITS}):
                  path = repo / target
                  if not path.is_file():
                      fail("{} does not exist".format(path))
                  texts[target] = path.read_text(encoding="utf-8").replace("\r\n", "\n")

              for name, target, old, new, occurrences, marker in EDITS:
                  text = texts[target]
                  if marker in text:
                      print("already applied: {} ({})".format(name, target))
                      continue
                  found = text.count(old)
                  if found != occurrences:
                      fail(
                          "{}: expected {} occurrence(s) of the anchor text for \"{}\", found {}".format(
                              target, occurrences, name, found
                          )
                      )
                  replaced = text.replace(old, new)
                  if replaced == text:
