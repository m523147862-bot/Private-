          """Where the nil path component comes from (patch G, v8) for the Applesauce iOS core.

          Counterpart of patch_cf_url.py (patch A), patch_logging_v2.py (patch B),
          patch_ns_bundle_root_fallback_v4.py (patch C), patch_euckr_v5.py (patch D),
          patch_fsinstrument_v6.py (patch E) and patch_fsprobe_v7.py (patch F). Like
          patch B, patch E and patch F this one is instrumentation only: it adds no API,
          no fallback and no behaviour change. Patch G does not edit one single line that
          patches A-F inserted - every insertion goes *beside* the existing statement,
          which is the property the v8 self-check re-asserts for each of the A-F markers.

          What it is for
          --------------
          The v7 device log settled the mechanism: 27 of the 28 uploaded textures are 1x1
          placeholders (only the 512x32 font atlas is real), and the app opens the same
          *path*, `<App>/Documents`, about once every 13 frames, forever. Patch F's
          `PATHJOIN WARNING` line shows that `-[NSString
          stringByAppendingPathComponent:]` is called with a nil or empty component 36
          times, and that is exactly how a file name becomes `<App>/Documents` + `""` =
          `<App>/Documents`: the path that is opened as a file, where lseek/read then
          fail. What the log still cannot answer is *which* guest step produced the nil.
          Patch G answers that, with four kinds of line and no behaviour change:

            G1  `src/fs_origin.rs` (new file): the line formats and the rate limit, so
                every call site below is a single added statement.
            G2  `src/frameworks/foundation/ns_string.rs`,
                `-[NSString stringByAppendingPathComponent:]`: beside patch F's
                `PATHJOIN WARNING`, a `PATHJOIN ORIGIN` line with the guest program
                counter and the guest return address of the very call that dropped the
                component (`pc=` is the instruction after the `svc` that entered the host,
                the same value patch F logs for a failed open; `ret=` is the guest link
                register, i.e. the address the guest returns to). Disassembling around
                those two addresses shows where the string that should have been the file
                name came from.
            G3  `src/frameworks/foundation/ns_user_defaults.rs`, the six key lookups
                `objectForKey:`, `stringForKey:`, `arrayForKey:`, `dictionaryForKey:`,
                `boolForKey:` and `integerForKey:`: `NSDEFAULTS <selector> key="..." ->`
                `nil` / `str(len=N)` / `<class name>`. This is the number one suspect for
                "the file name is empty": a `stringForKey:` that answers nil is passed
                straight into `stringByAppendingPathComponent:`. Every typed getter
                forwards to `objectForKey:`, so a `stringForKey:` query prints two lines
                (its own and the inner lookup) - by design, so the shared lookup path and
                the typed wrapper can be told apart.
            G4  `src/frameworks/foundation/ns_string.rs` and
                `src/frameworks/foundation/ns_data.rs`, the whole-file readers
                `-[NSString initWithContentsOfFile:]`, `-...encoding:error:`,
                `-...usedEncoding:error:` and `-[NSData initWithContentsOfFile:]` (which
                `+stringWithContentsOfFile:...` and `+dataWithContentsOfFile:` forward to):
                `NSREAD <kind> <path> -> nil` / `-> ok(len=N)`. Patch E only counted these
                reads (`FSREAD`), so the file names were invisible.
            G5  `src/fs.rs`, `Fs::read`: for the three files the v7 log shows the app
                creating in its own container (`Documents/DnfSlot`, `Documents/DnfOpt`,
                `Library/Preferences/com.nexonmobile.dnfswordman.plist`), a `FSBYTES` line
                with the byte count and the first 32 bytes in hex, so "empty", "all zero"
                and "has content" can be told apart at a glance. This one is read-side
                only, as asked: if the app never reads one of the three, nothing prints
                for it.

          Line formats:

          ```text
          PATHJOIN ORIGIN base="<path>" component=<nil|empty> pc=0x<hex8> ret=0x<hex8>
          NSDEFAULTS <selector> key="<key>" -> <nil|str(len=N)|<class name>>
          NSREAD <NSString|NSData> <guest path> -> nil
          NSREAD <NSString|NSData> <guest path> -> ok(len=<n>)
          FSBYTES <guest path> len=<n> hex=<first 32 bytes, lowercase hex, '-' if empty>
          ```

          Log volume and the rate limit
          ----------------------------
          The v7 device log is 519-839 lines / 64-84 KB. Only `NSUserDefaults` can fire
          every frame, so that is where the deduplication matters: a `(key, result)` pair
          prints its first `DEFAULTS_HEAD = 8` calls in full and one call in
          `DEFAULTS_SAMPLE = 100` afterwards, exactly as requested. The other three lines
          are rare by nature (36 path joins, a handful of `NSData`/`NSString` reads, at
