          Log volume and the rate limit
          ----------------------------
          The stack traces are the expensive line (twelve guest memory reads each) and
          are also the rarest: the v7 log has 36 nil components in a whole run, so three
          full traces are enough to see where the first ones come from. `PATHFOUND` is the
          only line that can fire many times (the app looks up the same assets over and
          over), so it gets the 40 / 100 policy the task asked for. The defaults writes
          reuse patch G's per-`(key, value)` budget (`DEFAULTS_HEAD` / `DEFAULTS_SAMPLE`)
          and the shared global backstop.

          Usage: python3 patch_stacktrace_v9.py [repo-root]   (default: current directory)

          The script applies the edits by exact text replacement, refuses to run unless
          every anchor matches the expected number of times, skips edits that are already
          applied (running it twice is safe) and re-checks every marker and the brace
